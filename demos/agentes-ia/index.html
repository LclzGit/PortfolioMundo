<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consultores de IA · prévia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Martian+Mono:wght@300;400&family=Schibsted+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Layout: agent tabs on top, chat in the middle, knowledge sidebar on the right (stacks on phones). */
  :root {
    color-scheme: dark;
    --night: #0a0f24;
    --panel: #10173a;
    --panel-2: #141c42;
    --ivory: #f4eee2;
    --muted: #a3a8c3;
    --dim: #6f7598;
    --gold: #e8c37e;
    --line: rgba(232, 195, 126, .22);
    --line-2: rgba(244, 238, 226, .1);
    --c: #2ec4b6;
    --serif: "Gloock", Georgia, serif;
    --sans: "Schibsted Grotesk", system-ui, sans-serif;
    --mono: "Martian Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--night); color: var(--ivory); font: 15px/1.55 var(--sans); display: flex; flex-direction: column; padding: 18px clamp(16px, 3vw, 32px); gap: 14px; }
  header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
  .eyebrow { font: 400 10.5px var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--gold); }
  h1 { margin: 6px 0 0; font: 400 clamp(28px, 3.4vw, 40px)/1 var(--serif); }
  .tabs { display: flex; gap: 0; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
  .tabs button { font: 400 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); background: transparent; border: 0; padding: 11px 16px; cursor: pointer; display: flex; gap: 8px; align-items: center; }
  .tabs button + button { border-left: 1px solid var(--line-2); }
  .tabs button i { width: 8px; height: 8px; border-radius: 50%; background: var(--tc); }
  .tabs button[aria-selected="true"] { color: var(--night); background: var(--gold); }
  .tabs button:focus-visible { outline: 2px solid var(--gold); outline-offset: -2px; }
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 14px; }
  .chat { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; display: flex; flex-direction: column; min-height: 0; }
  .chat-hd { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line-2); }
  .av { width: 38px; height: 38px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff 0 18%, var(--c) 19%); flex: none; position: relative; }
  .av::after { content: ""; position: absolute; right: 0; bottom: 0; width: 10px; height: 10px; border-radius: 50%; background: #3ddc97; border: 2px solid var(--panel); }
  .chat-hd b { font-weight: 600; }
  .chat-hd div span { display: block; font-size: 12.5px; color: var(--muted); }
  .lock { margin-left: auto; font: 400 10px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--gold); border: 1px solid var(--line); padding: 5px 8px; border-radius: 2px; white-space: nowrap; }
  .msgs { flex: 1; overflow-y: auto; padding: 18px 16px; display: flex; flex-direction: column; gap: 12px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  .m { max-width: 78%; padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; }
  .m.bot { background: var(--panel-2); border: 1px solid var(--line-2); border-top-left-radius: 3px; }
  .m.me { align-self: flex-end; background: var(--gold); color: var(--night); border-top-right-radius: 3px; }
  .m .src { display: block; margin-top: 8px; font: 400 10px var(--mono); color: var(--gold); letter-spacing: .04em; }
  .m .route { display: inline-block; margin-top: 8px; font: 400 10px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--night); background: var(--c); padding: 4px 8px; border-radius: 2px; }
  .m.locked { border-color: var(--line); color: var(--muted); }
  .typing { display: inline-flex; gap: 4px; }
  .typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: b 1s infinite; }
  .typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes b { 50% { transform: translateY(-4px); opacity: .5; } }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 10px; }
  .chips button { font: inherit; font-size: 12.5px; color: var(--ivory); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 5px 11px; cursor: pointer; }
  .chips button:hover, .chips button:focus-visible { border-color: var(--gold); color: var(--gold); outline: none; }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line-2); }
  input { flex: 1; min-width: 0; font: inherit; color: var(--ivory); background: #0b1130; border: 1px solid var(--line-2); border-radius: 3px; padding: 10px 12px; }
  input:focus { outline: none; border-color: var(--gold); }
  .send { font: 400 11px var(--mono); letter-spacing: .1em; text-transform: uppercase; background: var(--gold); color: var(--night); border: 0; border-radius: 2px; padding: 0 16px; cursor: pointer; }
  .send:hover, .send:focus-visible { background: var(--ivory); outline: none; }
  aside { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 16px; overflow-y: auto; min-height: 0; }
  aside h2 { font: 400 22px/1.1 var(--serif); margin: 6px 0 10px; }
  aside p { color: var(--muted); font-size: 13.5px; margin: 0 0 14px; }
  .sec { font: 400 9.5px var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--gold); margin: 16px 0 8px; display: flex; gap: 10px; align-items: center; }
  .sec::after { content: ""; flex: 1; height: 1px; background: var(--line-2); }
  aside ul { list-style: none; margin: 0; padding: 0; }
  aside li { font-size: 13px; padding: 6px 0; border-bottom: 1px dashed var(--line-2); }
  aside li small { display: block; color: var(--dim); font: 400 10px var(--mono); }
  .demo { position: fixed; right: 12px; bottom: 12px; z-index: 20; font: 600 11px system-ui, sans-serif; letter-spacing: .06em; text-transform: uppercase; background: rgba(0, 0, 0, .6); color: #fff; padding: 7px 10px; border-radius: 6px; pointer-events: none; }
  @media (max-width: 820px) {
    body { height: auto; }
    main { grid-template-columns: 1fr; }
    .chat { height: 72vh; }
    .m { max-width: 92%; }
    .chat-hd .lock { display: none; }
    .tabs { width: 100%; }
    .tabs button { flex: 1; justify-content: center; padding: 11px 8px; }
    header > div { min-width: 0; }
  }
  @media (prefers-reduced-motion: reduce) { .typing i { animation: none; } }
</style>
</head>
<body>
<header>
  <div>
    <div class="eyebrow">Agentes de IA · conhecimento travado</div>
    <h1>Consultores</h1>
  </div>
  <div class="tabs" role="tablist" id="tabs"></div>
</header>

<main>
  <section class="chat" aria-live="polite">
    <div class="chat-hd"><div class="av" aria-hidden="true"></div><div><b id="a-name"></b><span id="a-role"></span></div><span class="lock">Responde só com a base abaixo</span></div>
    <div class="msgs" id="msgs"></div>
    <div class="chips" id="chips"></div>
    <form id="form"><input id="q" autocomplete="off" placeholder="Pergunte algo…" aria-label="Sua pergunta"><button class="send" type="submit">Enviar</button></form>
  </section>
  <aside>
    <div class="eyebrow">Como funciona</div>
    <h2 id="s-title"></h2>
    <p id="s-desc"></p>
    <div class="sec">Base de conhecimento</div>
    <ul id="s-kb"></ul>
    <div class="sec">Regras</div>
    <ul id="s-rules"></ul>
  </aside>
</main>
<div class="demo">Prévia · respostas simuladas</div>

<script>
/* Simulação: as respostas vêm de uma base fixa por agente. Fora dela, o agente recusa. */
const AGENTS = {
  reforma: {
    name: "Consultor Reforma Tributária", tab: "Reforma Tributária", color: "#2ec4b6",
    role: "Responde dúvidas sobre CBS, IBS e Imposto Seletivo",
    desc: "Responde dúvidas sobre a Reforma Tributária com base na legislação e nas notas técnicas, e ajuda a analisar contratos com fornecedores: valida valores líquidos, estima o preço a partir de 2027 e redige pareceres.",
    kb: [["EC 132/2023", "Emenda que criou a reforma"], ["LC 214/2025", "Lei do IBS, CBS e Imposto Seletivo"], ["Notas técnicas", "Documentos fiscais eletrônicos"], ["Modelos de parecer", "Análise de contratos"]],
    rules: ["Responde só com o que está na base", "Sempre cita a fonte", "Fora do tema, recusa e explica por quê", "Valores são estimativas; o parecer final é humano"],
    hello: "Olá! Sou o Consultor da Reforma Tributária. Pergunte sobre CBS, IBS, Imposto Seletivo, o cronograma de transição ou o impacto num contrato.",
    chips: ["O que muda em 2027?", "Qual é o cronograma de transição?", "O que é o split payment?", "Como fica o preço de um contrato?", "Quem vai ganhar a Copa?"],
    kbAnswers: [
      { k: ["2027", "cbs", "pis", "cofins"], a: "Em 2027 a CBS passa a ser cobrada integralmente e o PIS e a COFINS deixam de existir. O IPI tem alíquota reduzida a zero, exceto para produtos que também são fabricados na Zona Franca de Manaus, e o Imposto Seletivo começa a valer.", src: "EC 132/2023 · LC 214/2025" },
      { k: ["cronograma", "transicao", "transição", "2026", "2029", "2033", "quando"], a: "• 2026: ano de teste, com CBS de 0,9% e IBS de 0,1% destacados na nota e compensáveis.\n• 2027: CBS integral; PIS e COFINS extintos; Imposto Seletivo começa.\n• 2029 a 2032: ICMS e ISS caem 10%, 20%, 30% e 40% por ano, e o IBS sobe na mesma proporção.\n• 2033: ICMS e ISS extintos; IBS integral.", src: "EC 132/2023 · LC 214/2025" },
      { k: ["split", "payment", "pagamento dividido"], a: "No split payment, o imposto é separado no momento do pagamento: o banco ou a instituição de pagamento envia a parte do IBS e da CBS direto ao governo, e o fornecedor recebe o valor líquido.", src: "LC 214/2025" },
      { k: ["contrato", "preco", "preço", "fornecedor", "liquido", "líquido", "bruto"], a: "Para estimar o preço a partir de 2027, eu separo o que o fornecedor recebe líquido, retiro os tributos que serão extintos (PIS, COFINS e, a partir de 2029, ICMS e ISS) e somo a CBS e o IBS por fora. Se o novo preço bruto proposto ficar acima desse valor justo, aponto a diferença no parecer.", src: "Modelo de parecer de contratos" },
      { k: ["aliquota", "alíquota", "quanto", "taxa", "26"], a: "A alíquota de referência ainda será fixada pelo Senado. As estimativas usadas na base são de 8,8% para a CBS e 17,7% para o IBS, perto de 26,5% somados, cobrados por fora do preço.", src: "LC 214/2025 · estimativas oficiais" },
      { k: ["seletivo", "is", "imposto do pecado"], a: "O Imposto Seletivo incide sobre bens e serviços prejudiciais à saúde ou ao meio ambiente, como cigarros, bebidas alcoólicas e bebidas açucaradas. Ele começa em 2027.", src: "EC 132/2023 · LC 214/2025" },
      { k: ["cesta", "basica", "básica", "reducao", "redução", "saude", "saúde", "educacao", "educação"], a: "A cesta básica nacional tem alíquota zero. Serviços de saúde e de educação, entre outros, têm redução de 60% nas alíquotas, e algumas profissões regulamentadas têm redução de 30%.", src: "LC 214/2025" },
      { k: ["credito", "crédito", "nao cumulativ", "não cumulativ"], a: "IBS e CBS são não cumulativos: o imposto pago nas compras vira crédito para abater o devido nas vendas, inclusive sobre bens de uso e consumo, com poucas exceções.", src: "LC 214/2025" },
    ],
  },
  doacoes: {
    name: "Consultor de Doações", tab: "Doações", color: "#ff8fb1",
    role: "Triagem de contratos de doação",
    desc: "Faz a análise de primeiro nível dos contratos dos processos de doação e direciona cada caso para o agente responsável pela legislação específica que se aplica a ele.",
    kb: [["Checklist de contratos", "Partes, objeto, contrapartidas"], ["Mapa de legislações", "Imposto sobre doações, dedutibilidade, incentivos"], ["Fluxo de encaminhamento", "Agentes especialistas"]],
    rules: ["Analisa o contrato e identifica o tipo de doação", "Encaminha para o especialista certo", "Não emite parecer final", "Fora do tema, recusa e explica por quê"],
    hello: "Olá! Sou o Consultor de Doações. Descreva o contrato de doação (quem doa, quem recebe, o que é doado e se há contrapartida) e eu indico qual especialista deve analisar.",
    chips: ["Doação de dinheiro para uma associação", "Patrocínio cultural com incentivo", "Doação de equipamentos para escola", "Doação entre pessoas físicas", "Me indica um restaurante"],
    kbAnswers: [
      { k: ["incentiv", "cultural", "cultura", "patrocinio", "patrocínio", "esporte", "fundo", "infancia", "infância", "idoso"], a: "Pelo que você descreveu, é uma doação ou patrocínio dentro de uma lei de incentivo. Nesses casos, o valor pode ser abatido do imposto de renda devido, dentro dos limites de cada lei, e o projeto precisa estar aprovado. Confira no contrato o número do projeto, o recibo exigido e as contrapartidas de marca.", src: "Mapa de legislações · incentivos fiscais", route: "Agente de Incentivos Fiscais" },
      { k: ["associacao", "associação", "ong", "oscip", "entidade", "instituto", "sem fins"], a: "É uma doação de pessoa jurídica para entidade sem fins lucrativos. A dedutibilidade depende da qualificação da entidade e tem limite sobre o lucro operacional. Antes de seguir, confira no contrato a qualificação da entidade, a finalidade do recurso e a ausência de contrapartida.", src: "Mapa de legislações · dedutibilidade", route: "Agente de Dedutibilidade" },
      { k: ["escola", "universidade", "ensino", "pesquisa", "equipamento", "bens"], a: "É uma doação de bens para instituição de ensino ou pesquisa. Além da dedutibilidade, que tem limite próprio, é preciso tratar a baixa contábil dos bens e verificar se há imposto na saída. Confira no contrato a lista de bens, o valor atribuído e o termo de recebimento.", src: "Mapa de legislações · bens e dedutibilidade", route: "Agente de Dedutibilidade" },
      { k: ["pessoa fisica", "pessoa física", "herança", "heranca", "itcmd", "filho", "familia", "família", "entre pessoas"], a: "Doação entre pessoas físicas está sujeita ao imposto estadual sobre doações (ITCMD), devido no estado do doador ou do bem. A alíquota é definida por cada estado, com teto nacional, e passou a ser progressiva. Confira o valor, o estado e se é adiantamento de herança.", src: "Mapa de legislações · imposto estadual sobre doações", route: "Agente de Imposto sobre Doações" },
      { k: ["contrapartida", "troca", "publicidade", "marca", "logo"], a: "Se há contrapartida, como exposição de marca, o contrato pode deixar de ser doação e virar patrocínio ou prestação de serviço, com outra tributação. Vale revisar o objeto e as cláusulas de contrapartida antes de seguir.", src: "Checklist de contratos", route: "Agente de Contratos" },
      { k: ["dinheiro", "valor", "transferencia", "transferência", "recurso"], a: "É uma doação em dinheiro. Para encaminhar, preciso saber quem recebe: entidade sem fins lucrativos, projeto incentivado ou pessoa física? Cada caso vai para um especialista diferente.", src: "Fluxo de encaminhamento" },
    ],
  },
};
const OFF = { reforma: "Essa pergunta está fora da minha base. Eu respondo só sobre a Reforma Tributária (CBS, IBS e Imposto Seletivo), para garantir que toda resposta tenha fonte.", doacoes: "Isso está fora do meu escopo. Eu só faço a triagem de contratos de doação e indico o especialista responsável." };

const $ = (s) => document.querySelector(s);
const norm = (s) => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
let cur = "reforma";
const hist = { reforma: [], doacoes: [] };

Object.entries(AGENTS).forEach(([id, a]) => {
  const b = document.createElement("button");
  b.type = "button"; b.role = "tab"; b.id = "tab-" + id; b.style.setProperty("--tc", a.color);
  b.innerHTML = "<i></i>"; b.append(a.tab);
  b.addEventListener("click", () => select(id));
  $("#tabs").appendChild(b);
});

function bubble(m) {
  const el = document.createElement("div");
  el.className = "m " + m.who + (m.locked ? " locked" : "");
  el.textContent = m.text;
  if (m.src) { const s = document.createElement("span"); s.className = "src"; s.textContent = "Fonte: " + m.src; el.appendChild(s); }
  if (m.route) { const r = document.createElement("span"); r.className = "route"; r.textContent = "→ Encaminhado para " + m.route; el.appendChild(r); }
  return el;
}
function renderMsgs() {
  const box = $("#msgs"); box.innerHTML = "";
  hist[cur].forEach((m) => box.appendChild(bubble(m)));
  box.scrollTop = box.scrollHeight;
}
function select(id) {
  cur = id; const a = AGENTS[id];
  document.documentElement.style.setProperty("--c", a.color);
  document.querySelectorAll(".tabs button").forEach((b) => b.setAttribute("aria-selected", b.id === "tab-" + id));
  $("#a-name").textContent = a.name; $("#a-role").textContent = a.role;
  $("#s-title").textContent = a.name; $("#s-desc").textContent = a.desc;
  $("#s-kb").innerHTML = ""; a.kb.forEach(([t, d]) => { const li = document.createElement("li"); li.textContent = t; const sm = document.createElement("small"); sm.textContent = d; li.appendChild(sm); $("#s-kb").appendChild(li); });
  $("#s-rules").innerHTML = ""; a.rules.forEach((t) => { const li = document.createElement("li"); li.textContent = t; $("#s-rules").appendChild(li); });
  $("#chips").innerHTML = ""; a.chips.forEach((t) => { const b = document.createElement("button"); b.type = "button"; b.textContent = t; b.addEventListener("click", () => ask(t)); $("#chips").appendChild(b); });
  if (!hist[id].length) hist[id].push({ who: "bot", text: a.hello });
  renderMsgs();
}
function answer(q) {
  const n = norm(q); let best = null, score = 0;
  AGENTS[cur].kbAnswers.forEach((e) => { const s = e.k.filter((k) => n.includes(norm(k))).length; if (s > score) { score = s; best = e; } });
  return best ? { who: "bot", text: best.a, src: best.src, route: best.route } : { who: "bot", text: OFF[cur], locked: true };
}
let busy = false;
function ask(q) {
  q = q.trim(); if (!q || busy) return;
  busy = true; const id = cur;
  hist[id].push({ who: "me", text: q }); renderMsgs();
  const box = $("#msgs"), t = document.createElement("div");
  t.className = "m bot"; t.innerHTML = '<span class="typing" aria-label="digitando"><i></i><i></i><i></i></span>';
  box.appendChild(t); box.scrollTop = box.scrollHeight;
  setTimeout(() => { hist[id].push(answer(q)); busy = false; if (cur === id) renderMsgs(); }, matchMedia("(prefers-reduced-motion: reduce)").matches ? 50 : 900);
}
$("#form").addEventListener("submit", (e) => { e.preventDefault(); ask($("#q").value); $("#q").value = ""; });
select(location.hash === "#doacoes" ? "doacoes" : "reforma");
</script>
</body>
</html>
