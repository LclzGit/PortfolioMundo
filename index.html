<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root {
    --night: #161a2e;
    --wall: #252c4a;
    --wall-2: #2c355a;
    --floor: #3a2c3a;
    --floor-2: #45343f;
    --wood: #b5784a;
    --wood-2: #8a5434;
    --wood-3: #5e3622;
    --metal: #3d4566;
    --bezel: #11131f;
    --cream: #f5ead2;
    --cream-2: #bfb59f;
    --lamp: #ffcf5a;
    --pixel: "Silkscreen", "Courier New", monospace;
    --term: "VT323", ui-monospace, monospace;
    --sans: "Inter Tight", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--night); color: var(--cream); }
  body { font-family: var(--sans); min-height: 100vh; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  a { color: inherit; }

  /* ---------- office ---------- */
  .office { min-height: 100vh; display: flex; flex-direction: column; transform-origin: 50% 50%; }
  .top {
    display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap;
    padding: clamp(18px, 3vw, 34px) clamp(16px, 3vw, 40px) clamp(14px, 2vw, 22px);
  }
  .top h1 {
    font-family: var(--pixel); font-weight: 700; letter-spacing: .02em;
    font-size: clamp(30px, 5.4vw, 68px); line-height: 1;
    text-shadow: 4px 4px 0 #000, 4px 4px 0 #000;
  }
  .top h1 span { color: var(--lamp); }
  .top p { margin-top: 10px; color: var(--cream-2); font-size: clamp(14px, 1.3vw, 17px); max-width: 52ch; }
  .top p b { color: var(--cream); font-weight: 600; }
  .hud { font-family: var(--term); font-size: 20px; line-height: 1.1; text-align: right; color: var(--cream-2); }
  .hud b { color: var(--lamp); font-weight: 400; }

  .room {
    flex: 1;
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 0;
    border-top: 4px solid #000; border-bottom: 4px solid #000;
    background: #000;
  }

  .station {
    position: relative; display: block; width: 100%; text-align: left;
    container-type: inline-size;
    background:
      linear-gradient(to bottom, transparent 82%, #000 82%, #000 calc(82% + 4px), transparent calc(82% + 4px)),
      repeating-linear-gradient(90deg, var(--floor) 0 22px, var(--floor-2) 22px 24px) bottom / 100% 18% no-repeat,
      repeating-linear-gradient(0deg, var(--wall) 0 6px, var(--wall-2) 6px 8px);
    outline: 2px solid #000;
    min-height: 0;
    padding: 0;
    transition: filter .2s;
  }
  .station:hover, .station:focus-visible { filter: brightness(1.12); }
  .station:focus-visible { outline: 4px solid var(--lamp); outline-offset: -4px; z-index: 2; }

  .rig { position: relative; width: 100%; aspect-ratio: 5 / 4; }
  .rig > * { position: absolute; }

  /* monitor */
  .monitor {
    left: 36%; width: 60%; top: 14%; height: 52%;
    background: var(--bezel);
    box-shadow: 0 0 0 3px #000, 0 0 40px -6px var(--c);
    padding: 5px 5px 9px;
  }
  .monitor::after { /* stand */
    content: ""; position: absolute; left: 42%; width: 16%; top: 100%; height: 7%;
    background: var(--metal); box-shadow: 0 0 0 2px #000;
  }
  .screen {
    position: relative; width: 100%; height: 100%; overflow: hidden;
    background: #0b0e17;
    font-family: var(--term); color: var(--c);
    font-size: clamp(10px, 4.6cqw, 17px); line-height: 1.02;
    padding: 4px 6px;
    display: flex; flex-direction: column;
  }
  .screen::after { /* scanlines */
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.28) 0 1px, transparent 1px 3px);
  }
  .scr-hd { display: flex; justify-content: space-between; color: #0b0e17; background: var(--c); padding: 0 4px; margin: -4px -6px 4px; }
  .lines { list-style: none; flex: 1; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; }
  .lines li { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: .55; }
  .lines li:last-child { opacity: 1; }
  .lines li:last-child::after { content: "█"; animation: blink 1s steps(2) infinite; }
  .scr-bar { height: 4px; background: rgba(255,255,255,.12); margin-top: 4px; }
  .scr-bar i { display: block; height: 100%; width: 0; background: var(--c); }
  @keyframes blink { 50% { opacity: 0; } }

  /* desk */
  .desk { left: 20%; right: 2%; top: 70%; height: 5%; background: var(--wood); box-shadow: 0 0 0 3px #000, inset 0 -4px 0 var(--wood-2); }
  .leg { top: 75%; bottom: 0; width: 4%; background: var(--wood-3); box-shadow: 0 0 0 2px #000; }
  .leg.l { left: 24%; } .leg.r { right: 6%; }
  .kbd { left: 31%; width: 20%; top: 67.2%; height: 2.8%; background: #c9cbd6; box-shadow: 0 0 0 2px #000; }
  .mug { right: 4%; top: 61%; width: 5%; height: 9%; background: var(--mug, #e8e3d6); box-shadow: 0 0 0 2px #000; }
  .mug::after { content: ""; position: absolute; left: 100%; top: 25%; width: 60%; height: 45%; border: 2px solid #000; border-left: 0; }
  .steam { right: 5%; top: 47%; width: 3%; height: 12%; opacity: .5; background: repeating-linear-gradient(0deg, var(--cream) 0 3px, transparent 3px 6px); animation: steam 2s steps(3) infinite; }
  @keyframes steam { 50% { transform: translateY(-4px); opacity: .2; } }
  .agent { left: 1%; bottom: 0; height: 64%; image-rendering: pixelated; }

  .plate {
    position: relative; display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
    padding: 10px 12px 12px; background: #0f1222; border-top: 3px solid #000;
  }
  .plate b { font-family: var(--pixel); font-weight: 700; font-size: clamp(15px, 7cqw, 22px); color: var(--c); letter-spacing: .03em; }
  .plate span { font-size: clamp(11px, 4.4cqw, 14px); color: var(--cream-2); text-align: right; }
  .open-hint {
    position: absolute; right: 8px; top: 8px; font-family: var(--term); font-size: 18px;
    background: var(--lamp); color: #000; padding: 0 6px; box-shadow: 3px 3px 0 #000;
    opacity: 0; transform: translateY(-4px); transition: opacity .15s, transform .15s;
  }
  .station:hover .open-hint, .station:focus-visible .open-hint { opacity: 1; transform: none; }

  .foot { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 12px clamp(16px, 3vw, 40px) 18px; font-family: var(--term); font-size: 19px; color: var(--cream-2); }
  .foot a { color: var(--lamp); }

  /* ---------- detail (zoomed monitor) ---------- */
  .detail {
    position: fixed; inset: 0; z-index: 20;
    background: #0b0e17; color: var(--cream);
    border: clamp(8px, 1.4vw, 16px) solid var(--bezel);
    box-shadow: inset 0 0 0 3px #000;
    display: flex; flex-direction: column;
    overflow: hidden;

  .detail[hidden] { display: none; }
  .detail::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 1px, transparent 1px 3px); }
  .d-bar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    background: var(--c); color: #0b0e17; padding: 6px 10px;
    font-family: var(--term); font-size: 20px;
  }
  .d-bar .who { margin-right: auto; }
  .d-btn { display: inline-flex; align-items: center; gap: 6px; background: #0b0e17; color: var(--c); padding: 2px 10px; font-family: var(--term); font-size: 20px; box-shadow: 3px 3px 0 rgba(0,0,0,.45); }
  .d-btn:hover, .d-btn:focus-visible { background: #000; outline: none; }
  .d-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 rgba(0,0,0,.45); }
  .d-scroll { flex: 1; overflow-y: auto; }
  .d-body {
    display: grid; grid-template-columns: 1.15fr 1fr; gap: clamp(20px, 3vw, 44px);
    padding: clamp(18px, 3vw, 44px); max-width: 1320px; margin: 0 auto;

  .d-media { display: flex; flex-direction: column; gap: 14px; }
  .d-shot { border: 3px solid var(--c); box-shadow: 6px 6px 0 #000; background: #000; aspect-ratio: 16 / 10; overflow: hidden; }
  .d-shot img { width: 100%; height: 100%; object-fit: cover; object-position: top center; display: block; }
  .d-shot pre { height: 100%; display: grid; place-items: center; font-family: var(--term); font-size: clamp(16px, 1.8vw, 24px); color: var(--c); line-height: 1.25; padding: 20px; white-space: pre; overflow: hidden; }
  .d-log { border: 2px dashed rgba(255,255,255,.18); padding: 10px 12px; font-family: var(--term); font-size: 19px; color: var(--c); min-height: 132px; }
  .d-log .lbl { color: var(--cream-2); }
  .d-log ul { list-style: none; }
  .d-log li { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .d-info { display: flex; flex-direction: column; gap: 16px; }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { font-family: var(--term); font-size: 18px; padding: 0 8px; border: 2px solid var(--c); color: var(--c); }
  .tag.solid { background: var(--c); color: #0b0e17; }
  .tag.warn { border-color: var(--lamp); color: var(--lamp); }

  .d-info .lede { font-size: clamp(16px, 1.4vw, 19px); line-height: 1.55; color: var(--cream); }
  .d-info ul.pts { list-style: none; display: flex; flex-direction: column; gap: 10px; }
  .d-info ul.pts li { position: relative; padding-left: 22px; color: var(--cream-2); line-height: 1.5; }
  .d-info ul.pts li::before { content: ""; position: absolute; left: 2px; top: .55em; width: 9px; height: 9px; background: var(--c); }
  .d-info ul.pts b { color: var(--cream); font-weight: 600; }
  .stack { display: flex; flex-wrap: wrap; gap: 6px; }
  .stack span { font-size: 13px; padding: 3px 9px; background: rgba(255,255,255,.07); color: var(--cream-2); }
  .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 4px; }
  .act { font-family: var(--pixel); font-weight: 600; font-size: 17px; text-decoration: none; padding: 8px 16px; border: 3px solid var(--c); color: var(--c); box-shadow: 4px 4px 0 #000; }
  .act.go { background: var(--c); color: #0b0e17; }
  .act:hover { transform: translate(-1px, -1px); box-shadow: 5px 5px 0 #000; }
  .act:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 #000; }
  .timeline { list-style: none; border-left: 3px solid var(--c); }
  .timeline li { padding: 0 0 12px 16px; position: relative; }
  .timeline li::before { content: ""; position: absolute; left: -8px; top: 6px; width: 13px; height: 13px; background: var(--c); box-shadow: 0 0 0 3px #0b0e17; }
  .timeline .when { font-family: var(--term); font-size: 18px; color: var(--cream-2); }

  @media (max-width: 1100px) {
    .room { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 860px) {
    .d-body { grid-template-columns: 1fr; }
    .d-bar .who { display: none; }
    .d-bar #prev { margin-left: auto; }
    .hud { text-align: left; }
  }
  @media (max-width: 420px) {
    .plate { flex-direction: column; gap: 2px; }
    .plate span { text-align: left; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>

/* =========================================================================
   Sprites (14 × 20 px, de perfil, olhando para o monitor)
   h cabelo · s pele · e olho · b camisa · d sombra · p calça · k sapato · c cadeira · v visor
   ========================================================================= */
const BODY_A = [
  "..............",
  "....hhhhh.....",
  "...hhhhhhhh...",
  "...hhhhsss....",
  "...hhsssses...",
  "...hhssssss...",
  "....hsssss....",
  ".....sss......",
  "....bbbbb.....",
  "...bbbbbbb....",
  "...bbbbddddss.",
  "...dbbbbbb....",
  "...dbbbbbb....",
  "..cdppppppp...",
  "..cppppppppp..",
  "..cc......pp..",
  "..cc......pp..",
  "..cc......kkk.",
  "..cccc........",
  "..c..c........",
];
const BODY_B = BODY_A.slice();
BODY_B[9] = "...bbbbbbddss.";
BODY_B[10] = "...bbbbbbb....";
const HELMET = { 1: "....hhhhh.....", 2: "...hhhhhhhh...", 3: "...hhhhhhhh...", 4: "...hhhvvvvv...", 5: "...hhhhhhhh...", 6: "....hhhhhh...." };

function drawAgent(cv, look, frame, blink) {
  const ctx = cv.getContext("2d");
  ctx.clearRect(0, 0, 14, 20);
  const pal = {
    h: look.hair, s: look.skin, e: blink ? look.skin : "#111", b: look.shirt, d: shade(look.shirt),
    p: look.pants, k: "#111", c: "#545b7a", v: look.visor || "#fff",
  };
  const rows = (frame ? BODY_B : BODY_A).map((r, i) => (look.helmet && HELMET[i]) || r);
  rows.forEach((row, y) => {
    for (let x = 0; x < 14; x++) {
      const ch = row[x];
      if (!ch || ch === ".") continue;
      ctx.fillStyle = pal[ch];
      ctx.fillRect(x, y, 1, 1);
    }
  });
}
function shade(hex) {
  const n = parseInt(hex.slice(1), 16);
  const f = (v) => Math.max(0, Math.floor(v * 0.7));
  return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`;
}

/* =========================================================================
   Monta o escritório
   ========================================================================= */
const $ = (s) => document.querySelector(s);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const rand = (a, b) => a + Math.random() * (b - a);
const room = $("#room");
const byId = {};
let current = null, busy = false;

PROJECTS.forEach((p, i) => {
  byId[p.id] = p;
  const st = document.createElement("button");
  st.type = "button";
  st.className = "station";
  st.style.setProperty("--c", p.color);
  if (p.about) st.style.setProperty("--mug", "#ffcf5a");
  st.setAttribute("aria-label", `Abrir ${p.title}: agente ${p.agent} ${p.job}`);
  st.innerHTML = `
    <div class="rig">
      <div class="leg l"></div><div class="leg r"></div>
      <div class="desk"></div>
      <div class="monitor"><div class="screen">
        <div class="scr-hd"><span>${(p.short || p.title).toUpperCase()}</span><span>${String(i + 1).padStart(2, "0")}</span></div>
        <ul class="lines"></ul>
        <div class="scr-bar"><i></i></div>
      </div></div>
      <div class="kbd"></div>
      <div class="mug"></div>${p.about ? '<div class="steam"></div>' : ""}
      <canvas class="agent" width="14" height="20"></canvas>
    </div>
    <div class="plate"><b>${p.agent}</b><span>${p.job}</span></div>
    <span class="open-hint">abrir ↵</span>`;
  st.addEventListener("click", () => open(p.id));
  room.appendChild(st);

  Object.assign(p, {
    st, cv: st.querySelector(".agent"), linesEl: st.querySelector(".lines"),
    barEl: st.querySelector(".scr-bar i"), monitor: st.querySelector(".monitor"),
    feed: [], li: 0, typing: null, typed: 0, progress: Math.random(), frame: 0, blinkT: rand(1, 5),
  });
  // pré-carrega 3 linhas
  for (let k = 0; k < 3; k++) pushLine(p, p.log[p.li++ % p.log.length]);
  drawAgent(p.cv, p.look, 0, false);
});

function pushLine(p, text) {
  p.feed.push(text);
  if (p.feed.length > 8) p.feed.shift();
  renderLines(p);
}
function renderLines(p) {
  const shown = p.feed.slice(-5);
  const html = shown.map((t, i) => {
    const isLast = i === shown.length - 1 && p.typing;
    return `<li>${esc(isLast ? t.slice(0, Math.floor(p.typed)) : t)}</li>`;
  }).join("");
  p.linesEl.innerHTML = html;
  if (current === p) $("#d-log").innerHTML = p.feed.slice(-6).map((t, i, a) => `<li>&gt; ${esc(i === a.length - 1 && p.typing ? t.slice(0, Math.floor(p.typed)) : t)}</li>`).join("");
}
function esc(s) { return s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

/* =========================================================================
   Loop: digitação, barra de progresso, animação dos agentes
   ========================================================================= */
let last = performance.now(), animT = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  animT += dt;
  PROJECTS.forEach((p) => {
    // digitação
    if (!p.typing) {
      p.wait = (p.wait ?? rand(0.4, 2.5)) - dt;
      if (p.wait <= 0) {
        p.typing = p.log[p.li++ % p.log.length];
        p.typed = 0; p.wait = undefined;
        pushLine(p, p.typing);
      }
    } else {
      const before = Math.floor(p.typed);
      p.typed += dt * 26;
      if (Math.floor(p.typed) !== before) renderLines(p);
      if (p.typed >= p.typing.length) { p.typing = null; renderLines(p); p.wait = rand(0.8, 2.6); }
    }
    // progresso
    p.progress = (p.progress + dt * 0.06) % 1;
    p.barEl.style.width = (p.progress * 100).toFixed(1) + "%";
    // sprite
    p.blinkT -= dt;
    const blink = p.blinkT < 0;
    if (p.blinkT < -0.14) p.blinkT = rand(2, 6);
    const f = p.typing ? Math.floor(animT * 8 + p.st.offsetLeft) % 2 : 0;
    if (f !== p.frame || blink !== p.blink) { p.frame = f; p.blink = blink; drawAgent(p.cv, p.look, f, blink); }
  });
  requestAnimationFrame(frame);
}

function tick() { $("#clock").textContent = new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }); }
tick(); setInterval(tick, 10000);

/* =========================================================================
   Zoom para o projeto e volta
   ========================================================================= */
const detail = $("#detail");
const office = $("#office");

function fill(p) {
  detail.style.setProperty("--c", p.color);
  $("#d-who").textContent = p.about ? `${p.agent} · o humano do escritório` : `agente ${p.agent} · ${p.job}`;
  $("#d-log-lbl").textContent = p.about ? "agenda de hoje" : `log ao vivo de ${p.agent}`;
  const shot = $("#d-shot");
  if (p.img) shot.innerHTML = `<img src="${p.img}" alt="${p.alt}" style="object-position:${p.imgPos || "top center"}">`;
  else if (p.glyph) shot.innerHTML = `<pre aria-hidden="true">${esc(p.glyph)}</pre>`;
  else {
    const big = document.createElement("canvas"); big.width = 14; big.height = 20;
    big.style.cssText = "height:80%;image-rendering:pixelated;display:block;margin:auto;position:relative;top:10%";
    drawAgent(big, p.look, 0, false);
    shot.innerHTML = ""; shot.style.background = "repeating-linear-gradient(0deg,#252c4a 0 6px,#2c355a 6px 8px)"; shot.appendChild(big);
  }
  if (p.img || p.glyph) shot.style.background = "";
  const tags = p.tags.map(([t, k]) => `<span class="tag ${k || ""}">${t}</span>`).join("");
  const pts = p.points.map((t) => `<li>${t}</li>`).join("");
  const stack = p.stack.map((t) => `<span>${t}</span>`).join("");
  const links = p.links.map(([t, u, go]) => `<a class="act ${go ? "go" : ""}" href="${u}" target="_blank" rel="noopener">${t} ↗</a>`).join("");
  const tl = p.timeline ? `<ol class="timeline">${p.timeline.map(([w, t]) => `<li><div class="when">${w}</div>${t}</li>`).join("")}</ol>` : "";
  $("#d-info").innerHTML = `
    <div class="tags">${tags}</div>
    <h2 id="d-title">${p.title}</h2>
    <p class="lede">${p.lede}</p>
    <ul class="pts">${pts}</ul>
    ${tl}
    <div class="stack">${stack}</div>
    ${links ? `<div class="actions">${links}</div>` : ""}`;
  $("#d-scroll").scrollTop = 0;
  current = p;
  renderLines(p);
}

function rectInset(el) {
  const r = el.getBoundingClientRect();
  return `inset(${r.top}px ${innerWidth - r.right}px ${innerHeight - r.bottom}px ${r.left}px)`;
}

function open(id, { push = true, animate = true } = {}) {
  const p = byId[id];
  if (!p || busy) return;
  const switching = !detail.hidden;
  fill(p);
  if (push) history.pushState({ id }, "", "#/" + id);
  if (switching) return;
  detail.hidden = false;
  document.body.style.overflow = "hidden";
  office.setAttribute("aria-hidden", "true");
  $("#back").focus({ preventScroll: true });
  if (reduce || !animate) return;
  busy = true;
  const r = p.monitor.getBoundingClientRect();
  const or = office.getBoundingClientRect();
  office.style.transformOrigin = `${r.left + r.width / 2 - or.left}px ${r.top + r.height / 2 - or.top}px`;
  office.animate([{ transform: "scale(1)", filter: "brightness(1)" }, { transform: "scale(2.4)", filter: "brightness(.4)" }],
    { duration: 650, easing: "cubic-bezier(.7,0,.2,1)", fill: "forwards" });
  const a = detail.animate([{ clipPath: rectInset(p.monitor) }, { clipPath: "inset(0px 0px 0px 0px)" }],
    { duration: 650, easing: "cubic-bezier(.7,0,.2,1)" });
  detail.querySelector(".d-body").animate([{ opacity: 0, transform: "scale(.96)" }, { opacity: 1, transform: "none" }],
    { duration: 400, delay: 380, easing: "ease-out", fill: "backwards" });
  a.onfinish = () => { busy = false; };
}

function close({ push = true } = {}) {
  if (detail.hidden || busy) return;
  const p = current;
  if (push) history.pushState({}, "", location.pathname + location.search);
  const done = () => {
    detail.hidden = true; busy = false; current = null;
    document.body.style.overflow = "";
    office.removeAttribute("aria-hidden");
    office.getAnimations().forEach((x) => x.cancel());
    p.st.focus({ preventScroll: true });
  };
  if (reduce) return done();
  busy = true;
  const o = office.animate([{ transform: "scale(2.4)", filter: "brightness(.4)" }, { transform: "scale(1)", filter: "brightness(1)" }],
    { duration: 600, easing: "cubic-bezier(.7,0,.2,1)", fill: "forwards" });
  office.getAnimations().forEach((x) => x !== o && x.cancel());
  const a = detail.animate([{ clipPath: "inset(0px 0px 0px 0px)" }, { clipPath: rectInset(p.monitor) }],
    { duration: 600, easing: "cubic-bezier(.7,0,.2,1)", fill: "forwards" });
  a.onfinish = () => { a.cancel(); done(); };
}

function step(dir) {
  const i = PROJECTS.indexOf(current);
  const p = PROJECTS[(i + dir + PROJECTS.length) % PROJECTS.length];
  history.replaceState({ id: p.id }, "", "#/" + p.id);
  fill(p);
  detail.querySelector(".d-body").animate([{ opacity: 0, transform: `translateX(${dir * 24}px)` }, { opacity: 1, transform: "none" }], { duration: 260, easing: "ease-out" });
}

$("#back").addEventListener("click", () => close());
$("#prev").addEventListener("click", () => step(-1));
$("#next").addEventListener("click", () => step(1));
addEventListener("keydown", (e) => {
  if (detail.hidden) return;
  if (e.key === "Escape") close();
  if (e.key === "ArrowRight") step(1);
  if (e.key === "ArrowLeft") step(-1);
});
addEventListener("popstate", () => {
  const id = (location.hash.match(/^#\/(.+)$/) || [])[1];
  if (id && byId[id]) open(id, { push: false });
  else close({ push: false });
});

// link direto (ex.: index.html#/reformapro)
const startId = (location.hash.match(/^#\/(.+)$/) || [])[1];
if (startId && byId[startId]) open(startId, { push: false, animate: false });

if (!reduce) requestAnimationFrame(frame);
else PROJECTS.forEach((p) => { p.barEl.style.width = (p.progress * 100) + "%"; });
</script>
</body>
