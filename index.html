<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lucas Calaza · Planeta</title>
<meta name="description" content="Lucas Calaza: um planeta onde robôs trabalham nos meus projetos reais. Arraste o planeta e clique numa área para abrir o projeto.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Martian+Mono:wght@300;400&family=Schibsted+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #0a0f24;
    --panel: rgba(13, 19, 46, .92);
    --panel-2: #141c42;
    --ivory: #f4eee2;
    --muted: #a3a8c3;
    --dim: #6f7598;
    --gold: #e8c37e;
    --gold-2: #b99357;
    --line: rgba(232, 195, 126, .22);
    --line-2: rgba(244, 238, 226, .1);
    --serif: "Gloock", "Didot", Georgia, serif;
    --sans: "Schibsted Grotesk", system-ui, sans-serif;
    --mono: "Martian Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--night); }
  body { font-family: var(--sans); color: var(--ivory); -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  a { color: inherit; }
  ::selection { background: var(--gold); color: var(--night); }

  #sky {
    position: fixed; inset: 0;
    background:
      radial-gradient(70% 45% at 50% 112%, rgba(255, 170, 120, .55) 0%, rgba(200, 110, 140, .32) 30%, transparent 70%),
      radial-gradient(60% 50% at 85% 10%, rgba(80, 90, 190, .25), transparent 70%),
      linear-gradient(180deg, #070b1d 0%, #0d1434 55%, #2a2350 100%);
  }
  /* celestial grid */
  #sky::after {
    content: ""; position: absolute; inset: 0; opacity: .5;
    background:
      radial-gradient(circle at 50% 50%, transparent 0 34vmin, rgba(232, 195, 126, .09) 34vmin calc(34vmin + 1px), transparent calc(34vmin + 1px) 47vmin, rgba(232, 195, 126, .06) 47vmin calc(47vmin + 1px), transparent calc(47vmin + 1px));
  }
  #world { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; outline: none; }
  #world.dragging { cursor: grabbing; }
  #world.hovering { cursor: pointer; }

  .eyebrow { font-family: var(--mono); font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); }

  /* ---------- HUD ---------- */
  .hud { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; padding: max(26px, env(safe-area-inset-top)) clamp(18px, 3.2vw, 44px) 0; pointer-events: none; z-index: 3; }
  .hud h1 { font-family: var(--serif); font-weight: 400; font-size: clamp(40px, 5.6vw, 80px); line-height: .92; letter-spacing: -0.015em; color: var(--ivory); margin-top: 12px; }
  .hud h1 em { font-style: normal; color: var(--gold); }
  .hud .rule { width: 72px; height: 1px; background: var(--gold); margin: 18px 0 14px; position: relative; }
  .hud .rule::after { content: ""; position: absolute; right: -4px; top: -3px; width: 7px; height: 7px; border: 1px solid var(--gold); transform: rotate(45deg); background: var(--night); }
  .hud p { max-width: 36ch; font-size: clamp(14px, 1.15vw, 16px); line-height: 1.55; color: var(--muted); }
  .hud p b { color: var(--ivory); font-weight: 500; }
  .readout { font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); text-align: right; display: grid; gap: 8px; }
  .readout div { display: flex; justify-content: flex-end; gap: 12px; align-items: baseline; }
  .readout b { color: var(--ivory); font-weight: 400; font-size: 12.5px; letter-spacing: .02em; }
  .readout .coord b { color: var(--gold); }

  /* ---------- labels over the globe ---------- */
  #world, #labels, .lbl, .hud, .dock { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 2; overflow: hidden; }
  .lbl {
    position: absolute; left: 0; top: 0; transform-origin: 50% 100%;
    pointer-events: auto; cursor: pointer;
    background: var(--panel); color: var(--ivory);
    border: 1px solid var(--line); border-radius: 3px;
    padding: 7px 11px 8px; white-space: nowrap;
    box-shadow: 0 10px 24px -12px rgba(0, 0, 0, .7);
    transition: opacity .25s, border-color .2s;
    will-change: transform, opacity;
  }
  .lbl::after { content: ""; position: absolute; left: 50%; bottom: -14px; width: 1px; height: 13px; background: linear-gradient(var(--gold), transparent); }
  .lbl .m { font-family: var(--mono); font-size: 9px; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); display: flex; gap: 6px; align-items: center; }
  .lbl .m i { width: 6px; height: 6px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); }
  .lbl .t { font-family: var(--serif); font-size: 16px; line-height: 1.15; margin-top: 3px; }
  .lbl .s { font-family: var(--mono); font-size: 9.5px; color: var(--muted); max-width: 220px; overflow: hidden; text-overflow: ellipsis; margin-top: 3px; }
  .lbl.hot { border-color: var(--gold); }
  .lbl.off { opacity: 0; pointer-events: none; }

  .tip {
    position: fixed; z-index: 4; pointer-events: none; left: 0; top: 0;
    background: var(--panel); border: 1px solid var(--line); border-radius: 3px; padding: 8px 11px;
    font-family: var(--mono); font-size: 10.5px; line-height: 1.55; color: var(--muted);
    opacity: 0; transition: opacity .12s;
  }
  .tip b { font-family: var(--serif); font-weight: 400; font-size: 17px; color: var(--ivory); letter-spacing: .01em; }
  .tip b::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--c); margin-right: 7px; vertical-align: 3px; }
  .tip.on { opacity: 1; }

  /* ---------- dock (index) ---------- */
  .dock {
    position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); transform: translateX(-50%);
    z-index: 3; display: flex; max-width: calc(100vw - 24px); overflow-x: auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 3px; scrollbar-width: none;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    transition: opacity .3s;
  }
  .dock::-webkit-scrollbar { display: none; }
  .dock button { display: flex; align-items: baseline; gap: 8px; padding: 11px 14px 10px; font-size: 13.5px; white-space: nowrap; color: var(--muted); position: relative; }
  .dock button + button { border-left: 1px solid var(--line-2); }
  .dock button .no { font-family: var(--mono); font-size: 9.5px; color: var(--gold-2); letter-spacing: .05em; }
  .dock button::after { content: ""; position: absolute; left: 14px; right: 14px; bottom: 5px; height: 1px; background: var(--c); transform: scaleX(0); transition: transform .25s; transform-origin: left; }
  .dock button:hover, .dock button:focus-visible, .dock button[aria-current="true"] { color: var(--ivory); outline: none; }
  .dock button:hover::after, .dock button:focus-visible::after, .dock button[aria-current="true"]::after { transform: scaleX(1); }
  .hint { position: fixed; left: 50%; bottom: calc(max(18px, env(safe-area-inset-bottom)) + 58px); transform: translateX(-50%); z-index: 3; font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); pointer-events: none; transition: opacity .4s; white-space: nowrap; }

  /* ---------- project panel ---------- */
  .panel {
    position: fixed; z-index: 5; top: 18px; right: 18px; bottom: 18px; width: var(--pw);
    background: var(--panel); color: var(--ivory);
    border: 1px solid var(--line); border-radius: 4px;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 40px 80px -30px rgba(0, 0, 0, .8);
    display: flex; flex-direction: column; overflow: hidden;
    transform: translateX(calc(100% + 40px)); transition: transform .6s cubic-bezier(.2, .8, .2, 1), visibility 0s .6s;
    visibility: hidden;
  }
  .panel.open { transform: none; visibility: visible; transition: transform .6s cubic-bezier(.2, .8, .2, 1); }
  .p-bar { display: flex; align-items: center; gap: 4px; padding: 10px 10px; border-bottom: 1px solid var(--line); }
  .p-btn { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--ivory); border: 1px solid transparent; border-radius: 2px; }
  .p-btn:hover, .p-btn:focus-visible { border-color: var(--gold); color: var(--gold); outline: none; }
  .p-btn.icon { width: 36px; justify-content: center; padding: 8px 0; font-family: var(--serif); font-size: 18px; letter-spacing: 0; }
  .p-bar .sp { flex: 1; }
  .p-scroll { flex: 1; overflow-y: auto; padding: 26px 28px 30px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  .p-scroll h2 { font-family: var(--serif); font-weight: 400; font-size: clamp(34px, 3.2vw, 46px); line-height: 1; letter-spacing: -0.01em; margin: 14px 0 10px; }
  .p-meta { display: flex; flex-wrap: wrap; gap: 6px 14px; font-family: var(--mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding-bottom: 18px; border-bottom: 1px solid var(--line-2); }
  .p-meta .c { color: var(--gold); }
  .p-meta .warn { color: #f0a46b; }
  .p-meta i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--c); margin-right: 6px; box-shadow: 0 0 8px var(--c); }
  .lede { font-size: 17px; line-height: 1.6; color: var(--ivory); margin-top: 18px; }
  .lede b { color: var(--gold); font-weight: 500; }
  .shot { margin: 22px 0 8px; padding: 6px; border: 1px solid var(--line); border-radius: 2px; }
  .shot > div.g { aspect-ratio: auto; background: #1f1f1f; }
  .shot > div.g img { height: auto; object-fit: contain; }
  .shot > div { aspect-ratio: 16 / 10; overflow: hidden; background: #0a0e22; }
  .shot img { width: 100%; height: 100%; object-fit: cover; object-position: top center; display: block; }
  .shot pre { height: 100%; display: grid; place-items: center; font-family: var(--mono); font-size: 11.5px; line-height: 1.7; color: var(--gold); white-space: pre; padding: 14px; overflow: hidden; }
  .cap { font-family: var(--mono); font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); text-align: right; }
  ol.pts { list-style: none; counter-reset: p; display: flex; flex-direction: column; gap: 14px; margin: 22px 0; }
  ol.pts li { counter-increment: p; display: grid; grid-template-columns: 34px 1fr; color: var(--muted); line-height: 1.55; font-size: 15px; }
  ol.pts li::before { content: counter(p, upper-roman) "."; font-family: var(--serif); color: var(--gold); font-size: 16px; line-height: 1.4; }
  ol.pts b { color: var(--ivory); font-weight: 500; }
  .sec { font-family: var(--mono); font-size: 9.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); margin: 22px 0 10px; display: flex; align-items: center; gap: 10px; }
  .sec::after { content: ""; flex: 1; height: 1px; background: var(--line-2); }
  .stack { font-family: var(--mono); font-size: 11px; line-height: 1.9; color: var(--muted); }
  .stack span + span::before { content: " · "; color: var(--gold-2); }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
  .act { text-decoration: none; font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; padding: 13px 18px 12px; border: 1px solid var(--gold); color: var(--gold); border-radius: 2px; transition: background .2s, color .2s; }
  .act.go { background: var(--gold); color: var(--night); }
  .act:hover { background: var(--ivory); border-color: var(--ivory); color: var(--night); }
  .crew ul { list-style: none; }
  .crew .log li { border: 0; padding: 0; }
  .crew li { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--line-2); font-size: 13.5px; }
  .crew li b { font-family: var(--mono); font-weight: 400; font-size: 11.5px; letter-spacing: .06em; }
  .crew li b::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--rc); margin-right: 8px; vertical-align: 1px; }
  .crew li span { color: var(--muted); text-align: right; }
  .log { margin-top: 16px; background: #080c1f; border-left: 2px solid var(--c); padding: 10px 14px; font-family: var(--mono); font-size: 11px; line-height: 1.85; min-height: 118px; }
  .log li { list-style: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--dim); }
  .log li:last-child { color: var(--ivory); }
  .timeline { list-style: none; margin: 4px 0 0; }
  .timeline li { display: grid; grid-template-columns: 82px 1fr; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--line-2); font-size: 14.5px; }
  .timeline .when { font-family: var(--mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--gold); padding-top: 3px; }

  .loading { position: fixed; inset: 0; display: grid; place-items: center; z-index: 6; font-family: var(--mono); font-size: 10.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--gold); pointer-events: none; transition: opacity .6s; }
  .loading.done { opacity: 0; }
  .nogl { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 2; max-width: 360px; text-align: center; color: var(--muted); line-height: 1.6; }

  :root { --pw: min(400px, calc(100vw - 36px)); }
  /* with a panel open, the area index moves into the free space left of the panel */
  @media (min-width: 761px) {
    body.focused .dock { left: 18px; transform: none; max-width: calc(100vw - var(--pw) - 54px); }
  }
  .hud > div:first-child, .hint { transition: opacity .4s; }
  body.focused .hud > div:first-child, body.focused .hint { opacity: 0; }

  @media (max-width: 760px) {
    .hud { flex-direction: column; gap: 14px; }
    .readout { text-align: left; }
    .readout div { justify-content: flex-start; }
    .hud .rule { margin: 12px 0 10px; }
    .panel { top: auto; left: 8px; right: 8px; bottom: 8px; width: auto; height: 62vh; transform: translateY(calc(100% + 30px)); }
    .p-scroll { padding: 20px 20px 26px; }
    .panel.open ~ .dock { opacity: 0; pointer-events: none; }
    body.focused .hud { opacity: 0; }
    .hud { padding-top: max(18px, env(safe-area-inset-top)); }
    .hud h1 { font-size: 38px; margin-top: 8px; }
    .hud .rule { width: 48px; margin: 10px 0 8px; }
    .hud p { font-size: 13.5px; max-width: 34ch; }
    .readout { display: none; }
    .lbl { padding: 5px 9px 6px; }
    .lbl .m, .lbl .s { display: none; }
    .lbl .t { font-size: 13px; margin-top: 0; }
    .hint { bottom: calc(max(18px, env(safe-area-inset-bottom)) + 54px); font-size: 9px; }
    .dock button { padding: 10px 12px 9px; font-size: 13px; }
  }
  /* prototypes */
  .proto { margin: 22px 0 8px; border: 1px solid var(--line); border-radius: 2px; padding: 16px; background: #090d22; }
  .pt-head { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-family: var(--mono); font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); margin-bottom: 14px; }
  .pt-head span:last-child { color: var(--dim); }
  .pt-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
  .proto label { display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--muted); min-width: 0; }
  .proto input, .proto select { font: 400 13px var(--mono); color: var(--ivory); background: #0f1534; border: 1px solid var(--line-2); border-radius: 2px; padding: 8px 9px; width: 100%; min-width: 0; }
  .proto input:focus, .proto select:focus { outline: none; border-color: var(--gold); }
  .pt-out { margin-top: 14px; border-top: 1px solid var(--line-2); display: grid; }
  .pt-out div { display: flex; justify-content: space-between; align-items: baseline; padding: 8px 0; border-bottom: 1px dashed var(--line-2); font-size: 13px; color: var(--muted); }
  .pt-out b { font-family: var(--mono); font-weight: 400; color: var(--ivory); font-variant-numeric: tabular-nums; }
  .pt-out .big b { font-family: var(--serif); font-size: 26px; color: var(--gold); }
  .pt-note { margin-top: 10px; font-size: 12px; color: var(--dim); line-height: 1.5; }
  .pt-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .pt-btn { font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; padding: 9px 13px; background: var(--gold); color: var(--night); border-radius: 2px; }
  .pt-btn:hover, .pt-btn:focus-visible { background: var(--ivory); outline: none; }
  .pt-inline { flex-direction: row !important; align-items: center; gap: 8px !important; }
  .pt-inline select { width: auto; }
  .pt-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-family: var(--mono); font-size: 10px; padding: 3px 7px; border-radius: 2px; white-space: nowrap; }
  .chip.ok { background: rgba(143, 214, 58, .14); color: #b5e57a; }
  .chip.warn { background: rgba(255, 201, 61, .14); color: #ffd877; }
  .chip.bad { background: rgba(255, 107, 107, .16); color: #ff9c9c; }
  .pt-table { overflow-x: auto; }
  .pt-table table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .pt-table th { text-align: left; font-family: var(--mono); font-weight: 400; font-size: 9.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); padding: 6px 8px 6px 0; border-bottom: 1px solid var(--line-2); }
  .pt-table td { padding: 7px 8px 7px 0; border-bottom: 1px dashed var(--line-2); color: var(--ivory); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .pt-table .r { text-align: right; }
  .pt-table tr.new td { animation: rowIn .6s ease-out; }
  @keyframes rowIn { from { background: rgba(232, 195, 126, .12); } }
  @media (max-width: 420px) { .pt-grid { grid-template-columns: 1fr; } }
  @media (prefers-reduced-motion: reduce) {
    .panel, .lbl, .dock, .dock button::after { transition: none; }
  }
</style>

</head>
<body>
<div id="sky"></div>
<canvas id="world" aria-label="Planeta 3D com robôs trabalhando nos projetos. Use os botões abaixo para abrir cada projeto."></canvas>
<div id="labels" aria-hidden="true"></div>
<div class="tip" id="tip"></div>

<header class="hud">
  <div>
    <div class="eyebrow">Atlas de projetos · 2026</div>
    <h1>Lucas <em>Calaza</em></h1>
    <div class="rule"></div>
    <p>Um pequeno planeta onde meus <b>robôs</b> tocam os <b>meus projetos reais</b>. Gire o planeta, aproxime e escolha um destino.</p>
  </div>
  <div class="readout">
    <div class="coord"><span>Centro da vista</span><b id="coord">—</b></div>
    <div><span>Hora local</span><b id="clock">--:--</b></div>
    <div><span>Projetos · Robôs</span><b id="s-count">—</b></div>
    <div><span>Na pausa agora</span><b id="s-rest">0</b></div>
  </div>
</header>


<div class="loading" id="loading">traçando o mapa…</div>
<div class="hint" id="hint">Arraste para girar · role ou pince para aproximar</div>

<aside class="panel" id="panel" aria-labelledby="p-title">
  <div class="p-bar">
    <button class="p-btn" id="back" type="button">← Voltar ao planeta</button>
    <span class="sp"></span>
    <button class="p-btn icon" id="prev" type="button" aria-label="Área anterior">‹</button>
    <button class="p-btn icon" id="next" type="button" aria-label="Próxima área">›</button>
  </div>
  <div class="p-scroll" id="p-scroll"></div>
</aside>

<nav class="dock" id="dock" aria-label="Áreas do planeta"></nav>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>
/* =========================================================================
   ÁREAS: os projetos reais (textos do repositório Portf-lio) + a pausa
   ========================================================================= */
const AREAS = [
  {
    id: "reformapro", title: "ReformaPro", place: "Biblioteca das Leis", color: "#2ec4b6", lat: 18, lon: 4, build: "library",
    robots: [["LEX", "indexa artigos"], ["NORMA", "busca a fonte oficial"]],
    tags: [["Destaque"], ["Plataforma de estudo"]],
    lede: "Plataforma de estudos da Reforma Tributária brasileira (IBS, CBS e Imposto Seletivo) que roda 100% no navegador.",
    points: [
      "<b>1.902 artigos</b> da LC 214/2025, LC 227/2026 e Regulamentos do CBS e do IBS, mais as Notas Técnicas da NFS-e",
      "Busca ranqueada por relevância, mapa da estrutura (Livro › Título › Capítulo) e leitor com anotações salvas no navegador",
      "Base atualizada automaticamente a partir da publicação oficial, com versões datadas",
    ],
    stack: ["HTML/CSS/JS", "Python", "Atualização automática", "Site estático"],
    img: "assets/img/reformapro.jpg", alt: "Tela inicial do ReformaPro com os módulos Busca, Mapa e Leitor",
    links: [["Abrir app", "https://lclzgit.github.io/reformapro/", true]],
    log: ["baixando LC 214/2025 da fonte oficial", "indexando art. 138 · IBS", "Nota Técnica 007 atualizada", "versão de 10/10/2026 salva", "busca 'split payment' em 0,8 ms", "1.902 artigos no índice"],

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
function rng(seed) { return () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const rand = rng(20261010);

/* live logs (also run without WebGL) */

function tickLogs(dt) {
  AREAS.forEach((a) => {
    a.next -= dt;
    if (a.next > 0) return;
    a.next = 2.2 + Math.random() * 2.5;
    a.feed.push(a.log[a.li++ % a.log.length]);
    if (a.feed.length > 6) a.feed.shift();
    if (a.lblS) a.lblS.textContent = "› " + a.feed[a.feed.length - 1];
    if (current === a) renderLog();
  });
}

    : a.proto ? `<div class="proto" id="proto"></div><div class="cap">Prancha ${no} · protótipo interativo</div>` : "";

  const stack = a.stack.length ? `<div class="sec">Ferramentas</div><div class="stack">${a.stack.map((t) => `<span>${esc(t)}</span>`).join("")}</div>` : "";
  const links = a.links.length ? `<div class="actions">${a.links.map(([t, u, go]) => `<a class="act ${go ? "go" : ""}" href="${u}" target="_blank" rel="noopener">${t} ↗</a>`).join("")}</div>` : "";
  const crewTitle = a.rest ? "Na pausa agora" : a.about ? "No QG agora" : "Tripulação";
  pScroll.innerHTML = `
    <div class="eyebrow">Nº ${no} — ${esc(a.place)}</div>
    <h2 id="p-title">${esc(a.title)}</h2>
    <div class="p-meta"><span class="c"><i></i>${fmtCoord(a.lat, a.lon)}</span>${tags}</div>
    <p class="lede">${a.lede}</p>
    ${shot}
    <ol class="pts">${pts}</ol>
    ${tl}${stack}${links}
    <div class="crew"><div class="sec">${crewTitle}</div><ul id="crew"></ul><ul class="log" id="plog"></ul></div>`;
  if (a.proto) { const el = $("#proto"); el.innerHTML = PROTOS[a.proto].html; PROTOS[a.proto].init(el); }
  pScroll.scrollTop = 0;
  current = a;
  renderCrew(); renderLog();
}

let world = null;

if (!world) {

function buildWorld() {
  const T = THREE;
  const canvas = $("#world");
  const renderer = new T.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  const scene = new T.Scene();
  const camera = new T.PerspectiveCamera(36, 1, 0.1, 500);
  const R = 10, WATER = -0.12, PLAZA = 0.24;

  /* lights */
  scene.add(new T.HemisphereLight(0xfff0dc, 0x4a4a8a, 0.85));
  const sun = new T.DirectionalLight(0xffe2bf, 0.95); sun.position.set(-14, 16, 18); scene.add(sun);
  const rim = new T.DirectionalLight(0xff9db5, 0.45); rim.position.set(18, -6, -10); scene.add(rim);

  /* stars */
  {
    const g = new T.BufferGeometry(), n = 700, p = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) {
      const u = rand() * 2 - 1, th = rand() * Math.PI * 2, s = Math.sqrt(1 - u * u), r = 160 + rand() * 60;
      p.set([s * Math.cos(th) * r, u * r, s * Math.sin(th) * r - 40], i * 3);
    }
    g.setAttribute("position", new T.BufferAttribute(p, 3));
    scene.add(new T.Points(g, new T.PointsMaterial({ color: 0xfff6e0, size: 1.6, sizeAttenuation: false, transparent: true, opacity: .8 })));
  }

  /* stage → globe (rotates) */
  const stage = new T.Group(); scene.add(stage);
  const globe = new T.Group(); stage.add(globe);

  /* atmosphere */
  stage.add(new T.Mesh(new T.SphereGeometry(R * 1.13, 64, 48), new T.ShaderMaterial({
    uniforms: { c: { value: new T.Color("#ffc6a8") } },
    vertexShader: "varying vec3 vN; varying vec3 vV; void main(){ vec4 mv = modelViewMatrix*vec4(position,1.0); vN = normalize(normalMatrix*normal); vV = normalize(-mv.xyz); gl_Position = projectionMatrix*mv; }",
    fragmentShader: "uniform vec3 c; varying vec3 vN; varying vec3 vV; void main(){ float f = 1.0-abs(dot(vN,vV)); f = pow(f,2.2); gl_FragColor = vec4(c, f*0.7); }",
    side: T.BackSide, transparent: true, blending: T.AdditiveBlending, depthWrite: false,
  })));

  /* ---- terrain ---- */
  function hash3(x, y, z) { let h = Math.imul(x, 374761393) ^ Math.imul(y, 668265263) ^ Math.imul(z, 1274126177); h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967295; }
  function vnoise(x, y, z) {
    const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
    const xf = x - xi, yf = y - yi, zf = z - zi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf);
    const L = (a, b, t) => a + (b - a) * t;
    const c = (i, j, k) => hash3(xi + i, yi + j, zi + k);
    return L(L(L(c(0, 0, 0), c(1, 0, 0), u), L(c(0, 1, 0), c(1, 1, 0), u), v), L(L(c(0, 0, 1), c(1, 0, 1), u), L(c(0, 1, 1), c(1, 1, 1), u), v), w);
  }
  const fbm = (x, y, z) => vnoise(x, y, z) * .6 + vnoise(x * 2.1, y * 2.1, z * 2.1) * .28 + vnoise(x * 4.3, y * 4.3, z * 4.3) * .12;

  const toDir = (lat, lon) => { const la = lat * Math.PI / 180, lo = lon * Math.PI / 180; return new T.Vector3(Math.cos(la) * Math.sin(lo), Math.sin(la), Math.cos(la) * Math.cos(lo)); };
  AREAS.forEach((a) => { a.dir = toDir(a.lat, a.lon); a.plaza = a.rest ? 0.34 : 0.27; });

  function terrain(d) {
    let boost = 0, flat = 0, near = 0;
    for (const a of AREAS) {
      const ang = Math.acos(clamp(d.dot(a.dir), -1, 1));
      boost += 1.4 * Math.exp(-(ang * ang) / 0.075);
      flat = Math.max(flat, 1 - smooth(a.plaza, a.plaza + 0.1, ang));
      near = Math.max(near, 1 - smooth(a.plaza, a.plaza + 0.4, ang));
    }
    const n = fbm(d.x * 1.8 + 7, d.y * 1.8 + 3, d.z * 1.8 + 11);
    const land = (n - 0.5) * 3.2 + boost - 0.12;
    let h;
    if (land < 0) h = WATER;
    else h = 0.04 + (Math.min(land, 1.3) * 0.34 + (fbm(d.x * 7, d.y * 7, d.z * 7) - 0.5) * 0.3 * Math.min(1, land * 2)) * (1 - near * 0.85);
    h = h * (1 - flat) + PLAZA * flat;
    return { h, land, flat };
  }
  const surfH = (d) => Math.max(terrain(d).h, WATER);

  {
    const geo = new T.IcosahedronGeometry(R, 34);
    const pos = geo.attributes.position, n = pos.count;
    const col = new Float32Array(n * 3);
    const v = new T.Vector3(), info = new Array(n);
    for (let i = 0; i < n; i++) {
      v.fromBufferAttribute(pos, i).normalize();
      const t = terrain(v); info[i] = t;
      v.multiplyScalar(R + t.h);
      pos.setXYZ(i, v.x, v.y, v.z);
    }
    const C = (h) => new T.Color(h);
    const pal = {
      deep: C("#3f86c9"), shallow: C("#5fbfe0"), sand: C("#efd9a2"),
      g1: C("#8fd06a"), g2: C("#7cc35e"), g3: C("#a2d978"), hill: C("#69ab55"), rock: C("#b9b39f"), plaza: C("#9fd47c"),
    };
    const fr = rng(7);
    for (let f = 0; f < n; f += 3) {
      const a = info[f], b = info[f + 1], c = info[f + 2];
      const land = (a.land + b.land + c.land) / 3, h = (a.h + b.h + c.h) / 3, flat = Math.max(a.flat, b.flat, c.flat);
      let k;
      if (a.h <= WATER && b.h <= WATER && c.h <= WATER) k = land < -0.45 ? pal.deep : pal.shallow;
      else if (flat > 0.5) k = pal.plaza;
      else if (land < 0.1) k = pal.sand;
      else if (h > 0.5) k = fr() < .5 ? pal.rock : pal.hill;
      else { const r = fr(); k = r < .4 ? pal.g1 : r < .75 ? pal.g2 : pal.g3; }
      for (let j = 0; j < 3; j++) col.set([k.r, k.g, k.b], (f + j) * 3);
    }
    geo.setAttribute("color", new T.BufferAttribute(col, 3));
    geo.computeVertexNormals();
    globe.add(new T.Mesh(geo, new T.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: .95 })));
    globe.add(new T.Mesh(new T.SphereGeometry(R + WATER + 0.02, 96, 64), new T.MeshStandardMaterial({ color: 0x6fd0f0, transparent: true, opacity: .28, roughness: .2, metalness: .1 })));
  }

  /* ---- helpers ---- */
  const mats = {};
  const mat = (c, o = {}) => { const k = c + JSON.stringify(o); return mats[k] || (mats[k] = new T.MeshStandardMaterial({ color: c, flatShading: true, roughness: .85, ...o })); };
  const glow = (c) => mats["g" + c] || (mats["g" + c] = new T.MeshBasicMaterial({ color: c }));
  const UP = new T.Vector3(0, 1, 0);
  function add(parent, geo, material, x = 0, y = 0, z = 0) { const m = new T.Mesh(geo, material); m.position.set(x, y, z); parent.add(m); return m; }
  const Box = (w, h, d) => new T.BoxGeometry(w, h, d);
  const Cyl = (rt, rb, h, s = 8) => new T.CylinderGeometry(rt, rb, h, s);
  const Ball = (r, d = 1) => new T.IcosahedronGeometry(r, d);
  const m4 = new T.Matrix4();
  function orient(obj, dir, fwd, lift = 0) {
    obj.position.copy(dir).multiplyScalar(R + surfH(dir) + lift);
    const f = fwd.clone().sub(dir.clone().multiplyScalar(fwd.dot(dir)));
    if (f.lengthSq() < 1e-8) f.set(1, 0, 0).sub(dir.clone().multiplyScalar(dir.x));
    f.normalize();
    const r = new T.Vector3().crossVectors(dir, f).normalize();
    m4.makeBasis(r, dir, f); obj.quaternion.setFromRotationMatrix(m4);
  }
  function slerpDir(a, b, t, out) {
    const ang = Math.acos(clamp(a.dot(b), -1, 1));
    if (ang < 1e-4) return out.copy(b);
    const s = Math.sin(ang);
    return out.copy(a).multiplyScalar(Math.sin((1 - t) * ang) / s).add(b.clone().multiplyScalar(Math.sin(t * ang) / s)).normalize();
  }
  const pickables = [];
  function tagPick(obj, area, robot) { obj.traverse((o) => { o.userData.area = area; if (robot) o.userData.robot = robot; }); pickables.push(obj); }

  /* ---- trees, clouds, satellite ---- */
  {
    const tr = rng(99), dirs = [];
    for (let i = 0; i < 1200 && dirs.length < 140; i++) {
      const u = tr() * 2 - 1, th = tr() * Math.PI * 2, s = Math.sqrt(1 - u * u);
      const d = new T.Vector3(s * Math.cos(th), u, s * Math.sin(th));
      const t = terrain(d);
      if (t.land < 0.18 || t.flat > 0.01) continue;
      if (AREAS.some((a) => d.angleTo(a.dir) < a.plaza + 0.1)) continue;
      dirs.push(d);
    }
    const trunk = new T.InstancedMesh(Cyl(0.06, 0.09, 0.4, 5), mat(0x8a5a3c), dirs.length);
    const crown = new T.InstancedMesh(new T.ConeGeometry(0.34, 0.8, 6), mat(0xffffff), dirs.length);
    const crown2 = new T.InstancedMesh(Ball(0.36, 0), mat(0xffffff), dirs.length);
    const greens = ["#4f9a4a", "#5fae54", "#3e8a48", "#77b85a"].map((c) => new T.Color(c));
    const blossom = ["#ff9fb8", "#ffc16b"].map((c) => new T.Color(c));
    const o = new T.Object3D(); let k1 = 0, k2 = 0;
    dirs.forEach((d, i) => {
      const s = 0.55 + tr() * 0.5;
      o.position.copy(d).multiplyScalar(R + surfH(d) - 0.03);
      o.quaternion.setFromUnitVectors(UP, d); o.rotateY(tr() * 6); o.scale.setScalar(s);
      o.translateY(0.2 * s); o.updateMatrix();
      trunk.setMatrixAt(i, o.matrix);
      o.translateY(0.5 * s); o.updateMatrix();
      if (tr() < 0.72) { crown.setMatrixAt(k1, o.matrix); crown.setColorAt(k1++, greens[i % 4]); }
      else { o.translateY(-0.12 * s); o.updateMatrix(); crown2.setMatrixAt(k2, o.matrix); crown2.setColorAt(k2++, tr() < .5 ? blossom[i % 2] : greens[(i + 1) % 4]); }
    });
    crown.count = k1; crown2.count = k2;
    globe.add(trunk, crown, crown2);
  }
  const clouds = new T.Group(); globe.add(clouds); // clouds ride with the planet when it is dragged
  const cloudMat = new T.MeshStandardMaterial({ color: 0xffffff, flatShading: true, roughness: 1, transparent: true, opacity: .92 });
  {
    const cr = rng(5), cm = cloudMat;
    for (let i = 0; i < 9; i++) {
      const g = new T.Group();
      const u = cr() * 1.6 - 0.8, th = cr() * Math.PI * 2, s = Math.sqrt(1 - u * u);
      const d = new T.Vector3(s * Math.cos(th), u, s * Math.sin(th));
      for (let k = 0; k < 4; k++) add(g, Ball(0.45 + cr() * 0.35, 1), cm, (k - 1.5) * 0.55, cr() * 0.2, (cr() - .5) * 0.5);
      g.position.copy(d).multiplyScalar(R + 2.6 + cr() * 0.8);
      g.quaternion.setFromUnitVectors(UP, d); g.scale.setScalar(0.45 + cr() * .3);
      clouds.add(g);
    }
  }
  const sat = new T.Group(); stage.add(sat);
  const satBody = new T.Group(); satBody.position.set(R + 7, 0, 0); sat.add(satBody);
  add(satBody, Box(0.6, 0.6, 0.9), mat(0xeae4d6));
  add(satBody, Box(1.6, 0.04, 0.6), mat(0x3e64b8, { metalness: .4, roughness: .4 }), 1.15, 0, 0);
  add(satBody, Box(1.6, 0.04, 0.6), mat(0x3e64b8, { metalness: .4, roughness: .4 }), -1.15, 0, 0);
  add(satBody, new T.ConeGeometry(0.25, 0.3, 10, 1, true), mat(0xffffff, { side: T.DoubleSide }), 0, 0.42, 0);
  const satBlink = add(satBody, Ball(0.07), glow(0xff5a5a), 0, 0.36, 0.5);
  sat.rotation.set(0.35, 0, 0.5);

  /* ---- buildings ---- */
  const anim = [];
  const B = {
    library(g, c) {
      add(g, Box(2.2, 1.1, 1.5), mat(0xf6ecd9), 0, 0.55, -0.3);
      const prism = new T.CylinderGeometry(0.9, 0.9, 2.4, 3); prism.rotateX(-Math.PI / 2); prism.rotateY(Math.PI / 2); prism.scale(1, 0.6, 1);
      add(g, prism, mat(c), 0, 1.37, -0.3);
      for (let i = 0; i < 4; i++) add(g, Cyl(0.08, 0.08, 1, 8), mat(0xffffff), -0.75 + i * 0.5, 0.5, 0.55);
      add(g, Box(2.4, 0.12, 0.6), mat(0xe2d5bb), 0, 0.06, 0.6);
      add(g, Box(0.45, 0.7, 0.05), mat(0x5a3b2a), 0, 0.35, 0.46);
      const book = new T.Group(); book.position.set(0, 2.55, -0.3); g.add(book);
      add(book, Box(0.7, 0.9, 0.16), mat(c)); add(book, Box(0.62, 0.84, 0.14), mat(0xfffaf0), 0.06, 0, 0);
      add(book, Box(0.06, 0.92, 0.18), mat(0x1f6f68), -0.34, 0, 0);
      anim.push((t) => { book.rotation.y = t * 0.8; book.position.y = 2.55 + Math.sin(t * 1.6) * 0.12; });
      for (let i = 0; i < 3; i++) add(g, Box(0.35, 0.12, 0.25), mat([0xe36a5c, 0x2ec4b6, 0xf2b84b][i]), 1.45, 0.06 + i * 0.12, 0.6 - i * 0.02);
    },
    archive(g, c) {
      for (let i = 0; i < 3; i++) {
        add(g, Box(1.2, 0.72, 1), mat(i % 2 ? 0xdfe8f6 : 0xc7d6ef), 0, 0.36 + i * 0.74, -0.2);
        for (let j = 0; j < 2; j++) add(g, Box(0.9, 0.06, 0.03), mat(c), 0, 0.2 + i * 0.74 + j * 0.3, 0.31);
      }
      add(g, Cyl(0.7, 0.7, 0.1, 8), mat(c), 0, 2.27, -0.2);
      const papers = new T.Group(); papers.position.set(0, 1.2, -0.2); g.add(papers);
      for (let i = 0; i < 6; i++) { const p = add(papers, Box(0.32, 0.02, 0.42), mat(0xffffff), Math.cos(i) * 1.1, i * 0.25, Math.sin(i) * 1.1); p.rotation.set(0.3, i, 0.2); }
      anim.push((t) => { papers.rotation.y = t * 0.6; });
      add(g, Box(0.7, 0.4, 0.5), mat(0x4d5a77), 1.3, 0.2, 0.4); add(g, Box(0.5, 0.02, 0.4), mat(0xffffff), 1.3, 0.42, 0.45);
    },
    factory(g, c) {
      add(g, Box(2.2, 1.1, 1.4), mat(0xf1e2cc), 0, 0.55, -0.3);
      for (let i = 0; i < 3; i++) { const r = add(g, Box(0.74, 0.4, 1.42), mat(c), -0.73 + i * 0.73, 1.25, -0.3); r.rotation.z = -0.5; }
      add(g, Cyl(0.18, 0.24, 1.4, 8), mat(0xb35c2a), 0.8, 1.6, -0.75);
      const gear = new T.Group(); gear.position.set(-0.4, 0.62, 0.42); g.add(gear);
      add(gear, Cyl(0.32, 0.32, 0.1, 10), mat(0x666e85, { metalness: .3 })).rotation.x = Math.PI / 2;
      for (let i = 0; i < 8; i++) { const tooth = add(gear, Box(0.12, 0.14, 0.1), mat(0x666e85), Math.cos(i * Math.PI / 4) * 0.38, Math.sin(i * Math.PI / 4) * 0.38, 0); tooth.rotation.z = i * Math.PI / 4; }
      add(g, Box(0.5, 0.6, 0.05), mat(0x6a4630), 0.45, 0.3, 0.41);
      const smoke = [];
      for (let i = 0; i < 5; i++) smoke.push(add(g, Ball(0.2, 1), new T.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: .8, roughness: 1, flatShading: true }), 0.8, 2.4, -0.75));
      add(g, Box(0.4, 0.3, 1.6), mat(0x4a4f63), 1.5, 0.15, 0.1);

        coins.forEach((m, i) => { m.position.z = -0.65 + ((t * 0.4 + i / 4) % 1) * 1.5; });
      });
    },
    scale(g, c) {
      add(g, Cyl(0.12, 0.2, 1.8, 8), mat(0x6b7088, { metalness: .4 }), 0, 0.9, -0.2);
      add(g, Cyl(0.45, 0.55, 0.15, 10), mat(0x6b7088), 0, 0.08, -0.2);
      const beam = new T.Group(); beam.position.set(0, 1.85, -0.2); g.add(beam);
      add(beam, Box(2.6, 0.1, 0.12), mat(c));
      add(beam, Ball(0.14, 1), mat(0xffd34d, { metalness: .5 }), 0, 0.08, 0);
      const pans = [-1.2, 1.2].map((x) => { const p = new T.Group(); p.position.set(x, 0, 0); beam.add(p); add(p, Cyl(0.015, 0.015, 0.7, 4), mat(0x333333), 0, -0.35, 0); add(p, Cyl(0.42, 0.3, 0.1, 10), mat(0xf3e2c7), 0, -0.72, 0); return p; });

    crewT -= dt;
    if (crewT < 0) { crewT = 0.5; if (current) renderCrew(); $("#s-rest").textContent = allRobots.filter((r) => r.state === "rest").length; }
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame((t) => { last = t; frame(t); $("#loading").classList.add("done"); });

  return { focusArea, unfocus };
}

/* =========================================================================
   Abrir / fechar área (com histórico do navegador)
   ========================================================================= */
function open(id, push = true) {
  const a = byId[id]; if (!a) return;
  fillPanel(a);
  panel.classList.add("open");
  document.body.classList.add("focused");
  AREAS.forEach((x) => x.dockBtn.setAttribute("aria-current", x === a ? "true" : "false"));
  if (world) world.focusArea(a);
  if (push && location.hash !== "#/" + id) history.pushState({ id }, "", "#/" + id);
  $("#hint").style.opacity = 0;
}
function close(push = true) {
  if (!current) return;
  const a = current;
  current = null;
  panel.classList.remove("open");
  document.body.classList.remove("focused");
  AREAS.forEach((x) => x.dockBtn.setAttribute("aria-current", "false"));
  if (world) world.unfocus();
  if (push) history.pushState({}, "", location.pathname + location.search);
  a.dockBtn.focus({ preventScroll: true });
}
function step(dir) {
  const i = AREAS.indexOf(current);
  const a = AREAS[(i + dir + AREAS.length) % AREAS.length];
  history.replaceState({ id: a.id }, "", "#/" + a.id);
  open(a.id, false);
}
$("#back").addEventListener("click", () => close());
$("#prev").addEventListener("click", () => step(-1));
$("#next").addEventListener("click", () => step(1));
addEventListener("keydown", (e) => {
  if (!current) return;
  if (e.key === "Escape") close();
  else if (e.key === "ArrowRight") step(1);
  else if (e.key === "ArrowLeft") step(-1);
});
addEventListener("popstate", () => {
  const id = (location.hash.match(/^#\/(.+)$/) || [])[1];
  if (id && byId[id]) open(id, false); else close(false);
});
const startId = (location.hash.match(/^#\/(.+)$/) || [])[1];
if (startId && byId[startId]) setTimeout(() => open(startId, false), 300);

function tick() { $("#clock").textContent = new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }); }
tick(); setInterval(tick, 10000);
</script>
