<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lucas Calaza · Planeta</title>
<meta name="description" content="Lucas Calaza: um planeta onde robôs trabalham nos meus projetos reais. Arraste o globo e clique numa área para abrir o projeto.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Inter+Tight:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1f1b2e;
    --ink-2: #645e78;
    --paper: #fff8ec;
    --paper-2: #f3e8d4;
    --line: #e6d7bb;
    --cream: #fff3dd;
    --sun: #ffd27a;
    --display: "Bricolage Grotesque", system-ui, sans-serif;
    --sans: "Inter Tight", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #191b45; }
  body { font-family: var(--sans); color: var(--cream); -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  a { color: inherit; }

  #sky {
    position: fixed; inset: 0;
    background:
      radial-gradient(90% 60% at 50% 115%, #ffb38a 0%, #e5808a 18%, #8e5a92 38%, #3b3474 60%, #1d1f4f 80%, #14163a 100%);
  }
  #world { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; outline: none; }
  #world.dragging { cursor: grabbing; }
  #world.hovering { cursor: pointer; }

  /* ---------- HUD ---------- */
  .hud { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; padding: max(20px, env(safe-area-inset-top)) clamp(16px, 3vw, 36px) 0; pointer-events: none; z-index: 3; }
  .hud h1 { font-family: var(--display); font-weight: 800; font-size: clamp(30px, 4.6vw, 60px); line-height: .95; letter-spacing: -0.03em; color: var(--cream); text-shadow: 0 2px 24px rgba(20, 16, 60, .45); }
  .hud h1 span { color: var(--sun); }
  .hud p { margin-top: 10px; max-width: 34ch; font-size: clamp(14px, 1.2vw, 16px); line-height: 1.45; color: #e9dcef; }
  .hud p b { color: #fff; font-weight: 600; }
  .stats { font-family: var(--mono); font-size: 12.5px; text-align: right; color: #e2d6ee; line-height: 1.7; }
  .stats b { color: var(--sun); font-weight: 500; }

  /* ---------- labels over the globe ---------- */
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 2; overflow: hidden; }
  .lbl {
    position: absolute; left: 0; top: 0; transform-origin: 50% 100%;
    pointer-events: auto; cursor: pointer;
    background: var(--paper); color: var(--ink); border-radius: 12px; padding: 6px 10px 7px;
    box-shadow: 0 6px 18px -6px rgba(20, 10, 50, .5); white-space: nowrap;
    transition: opacity .25s;
    will-change: transform, opacity;
  }
  .lbl::after { content: ""; position: absolute; left: 50%; bottom: -5px; width: 10px; height: 10px; background: var(--paper); transform: translateX(-50%) rotate(45deg); border-radius: 2px; }
  .lbl .t { display: flex; align-items: center; gap: 6px; font-family: var(--display); font-weight: 700; font-size: 14px; letter-spacing: -0.01em; }
  .lbl .t i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); flex: none; }
  .lbl .s { font-family: var(--mono); font-size: 11px; color: var(--ink-2); max-width: 210px; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
  .lbl.hot { box-shadow: 0 0 0 3px var(--c), 0 10px 24px -6px rgba(20, 10, 50, .6); }
  .lbl.off { opacity: 0; pointer-events: none; }

  .tip {
    position: fixed; z-index: 4; pointer-events: none; left: 0; top: 0;
    background: var(--ink); color: var(--cream); border-radius: 10px; padding: 7px 10px;
    font-family: var(--mono); font-size: 12px; line-height: 1.4; box-shadow: 0 8px 20px -8px rgba(0,0,0,.6);
    opacity: 0; transition: opacity .12s;
  }
  .tip b { font-family: var(--display); font-size: 14px; color: var(--c, var(--sun)); }
  .tip.on { opacity: 1; }

  /* ---------- dock ---------- */
  .dock {
    position: fixed; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); transform: translateX(-50%);
    z-index: 3; display: flex; gap: 6px; padding: 6px; max-width: calc(100vw - 24px); overflow-x: auto;
    background: rgba(255, 248, 236, .14); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 248, 236, .22); border-radius: 16px; scrollbar-width: none;
    transition: transform .4s, opacity .3s;
  }
  .dock::-webkit-scrollbar { display: none; }
  .dock button { display: flex; align-items: center; gap: 7px; padding: 8px 12px; border-radius: 11px; font-size: 13.5px; font-weight: 500; white-space: nowrap; color: var(--cream); }
  .dock button i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); box-shadow: 0 0 10px var(--c); }
  .dock button:hover, .dock button:focus-visible, .dock button[aria-current="true"] { background: var(--paper); color: var(--ink); outline: none; }
  .hint { position: fixed; left: 50%; bottom: calc(max(16px, env(safe-area-inset-bottom)) + 62px); transform: translateX(-50%); z-index: 3; font-family: var(--mono); font-size: 12px; color: #e9dcef; opacity: .85; pointer-events: none; transition: opacity .4s; white-space: nowrap; }

  /* ---------- project panel ---------- */
  .panel {
    position: fixed; z-index: 5; top: 16px; right: 16px; bottom: 16px; width: min(470px, calc(100vw - 32px));
    background: var(--paper); color: var(--ink); border-radius: 22px;
    box-shadow: 0 30px 60px -20px rgba(10, 5, 40, .6);
    display: flex; flex-direction: column; overflow: hidden;
    transform: translateX(calc(100% + 40px)); transition: transform .55s cubic-bezier(.2, .8, .2, 1), visibility 0s .55s;
    visibility: hidden;
  }
  .panel.open { transform: none; visibility: visible; transition: transform .55s cubic-bezier(.2, .8, .2, 1); }
  .p-bar { display: flex; align-items: center; gap: 6px; padding: 12px 12px 10px; border-bottom: 1px solid var(--line); }
  .p-btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 10px; font-size: 14px; font-weight: 600; background: var(--paper-2); }
  .p-btn:hover, .p-btn:focus-visible { background: var(--ink); color: var(--paper); outline: none; }
  .p-btn.icon { width: 36px; justify-content: center; padding: 8px 0; }
  .p-bar .sp { flex: 1; }
  .p-scroll { flex: 1; overflow-y: auto; padding: 18px 20px 24px; }
  .p-hero { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .tag { font-family: var(--mono); font-size: 11.5px; padding: 3px 8px; border-radius: 7px; background: color-mix(in srgb, var(--c) 18%, white); color: color-mix(in srgb, var(--c) 50%, black); }
  .tag.warn { background: #f6e6c7; color: #8a5a00; }
  .tag.place { background: transparent; color: var(--ink-2); padding-left: 2px; }
  .p-scroll h2 { font-family: var(--display); font-weight: 800; font-size: clamp(28px, 3vw, 36px); line-height: 1.02; letter-spacing: -0.025em; margin: 6px 0 12px; }
  .p-scroll h2 i { display: inline-block; width: 14px; height: 14px; border-radius: 50%; background: var(--c); margin-right: 10px; vertical-align: 4px; }
  .lede { font-size: 16.5px; line-height: 1.55; color: var(--ink); }
  .shot { margin: 16px 0; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); background: var(--paper-2); aspect-ratio: 16 / 10; }
  .shot img { width: 100%; height: 100%; object-fit: cover; object-position: top center; display: block; }
  .shot pre { height: 100%; display: grid; place-items: center; font-family: var(--mono); font-size: 13px; line-height: 1.6; color: var(--ink-2); white-space: pre; padding: 14px; overflow: hidden; }
  ul.pts { list-style: none; display: flex; flex-direction: column; gap: 9px; margin: 14px 0; }
  ul.pts li { position: relative; padding-left: 20px; color: var(--ink-2); line-height: 1.5; font-size: 15px; }
  ul.pts li::before { content: ""; position: absolute; left: 3px; top: .55em; width: 8px; height: 8px; border-radius: 3px; background: var(--c); }
  ul.pts b { color: var(--ink); font-weight: 600; }
  .stack { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 16px; }
  .stack span { font-size: 12.5px; padding: 3px 9px; border-radius: 7px; border: 1px solid var(--line); color: var(--ink-2); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .act { text-decoration: none; font-weight: 600; font-size: 14.5px; padding: 10px 16px; border-radius: 12px; border: 1.5px solid var(--ink); }
  .act.go { background: var(--ink); color: var(--paper); }
  .act:hover { transform: translateY(-1px); }
  .crew { border-top: 1px dashed var(--line); padding-top: 14px; }
  .crew h3 { font-family: var(--display); font-size: 15px; font-weight: 700; margin-bottom: 8px; }
  .crew ul { list-style: none; display: flex; flex-direction: column; gap: 6px; }
  .crew li { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; }
  .crew li b { font-family: var(--mono); font-weight: 500; }
  .crew li span { color: var(--ink-2); font-size: 13px; text-align: right; }
  .log { margin-top: 12px; background: var(--ink); color: #cfe9d9; border-radius: 12px; padding: 10px 12px; font-family: var(--mono); font-size: 12.5px; line-height: 1.6; min-height: 112px; }
  .log li { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: .6; }
  .log li:last-child { opacity: 1; color: var(--c); }
  .timeline { list-style: none; border-left: 2px solid var(--line); margin: 14px 0 16px 4px; }
  .timeline li { position: relative; padding: 0 0 10px 16px; font-size: 14.5px; }
  .timeline li::before { content: ""; position: absolute; left: -6px; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--paper); border: 2px solid var(--c); }
  .timeline .when { font-family: var(--mono); font-size: 12px; color: var(--ink-2); }

  .hud > div:first-child, .hint { transition: opacity .4s; }
  body.focused .hud > div:first-child, body.focused .hint { opacity: 0; }
  @media (max-width: 760px) { body.focused .hud { opacity: 0; } }
  .loading { position: fixed; inset: 0; display: grid; place-items: center; z-index: 6; font-family: var(--mono); font-size: 13px; color: #e9dcef; pointer-events: none; transition: opacity .6s; }
  .loading.done { opacity: 0; }
  .nogl { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 2; max-width: 360px; text-align: center; color: #e9dcef; line-height: 1.5; }

  @media (max-width: 760px) {
    .hud { flex-direction: column; gap: 6px; }
    .stats { text-align: left; }
    .hud p { max-width: 30ch; }
    .panel { top: auto; left: 8px; right: 8px; bottom: 8px; width: auto; height: 62vh; border-radius: 22px 22px 18px 18px; transform: translateY(calc(100% + 30px)); }
    .panel.open ~ .dock { opacity: 0; pointer-events: none; }
    .lbl .s { display: none; }
    .lbl .t { font-size: 12.5px; }
    .lbl { padding: 5px 8px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .panel, .lbl, .dock { transition: none; }
  }
</style>
</head>

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
function rng(seed) { return () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const rand = rng(20261010);
const byId = Object.fromEntries(AREAS.map((a) => [a.id, a]));
const allRobots = [];
let current = null;

/* live logs (also run without WebGL) */
AREAS.forEach((a) => { a.feed = a.log.slice(0, 3); a.li = 3; a.next = 1 + Math.random() * 2; });
function tickLogs(dt) {
  AREAS.forEach((a) => {
    a.next -= dt;
    if (a.next > 0) return;
    a.next = 2.2 + Math.random() * 2.5;
    a.feed.push(a.log[a.li++ % a.log.length]);
    if (a.feed.length > 6) a.feed.shift();
    if (a.lblS) a.lblS.textContent = "› " + a.feed[a.feed.length - 1];
    if (current === a) renderLog();
  });
}

const panel = $("#panel"), pScroll = $("#p-scroll");

function fillPanel(a) {
  panel.style.setProperty("--c", a.color);
  const tags = a.tags.map(([t, k]) => `<span class="tag ${k || ""}">${esc(t)}</span>`).join("");
  const shot = a.img ? `<div class="shot"><img src="${a.img}" alt="${esc(a.alt)}" style="object-position:${a.imgPos || "top center"}"></div>`
    : a.glyph ? `<div class="shot"><pre aria-hidden="true">${esc(a.glyph)}</pre></div>` : "";
  const pts = a.points.map((t) => `<li>${t}</li>`).join("");
  const tl = a.timeline ? `<ol class="timeline">${a.timeline.map(([w, t]) => `<li><div class="when">${w}</div>${t}</li>`).join("")}</ol>` : "";
  const stack = a.stack.length ? `<div class="stack">${a.stack.map((t) => `<span>${esc(t)}</span>`).join("")}</div>` : "";
  const links = a.links.length ? `<div class="actions">${a.links.map(([t, u, go]) => `<a class="act ${go ? "go" : ""}" href="${u}" target="_blank" rel="noopener">${t} ↗</a>`).join("")}</div>` : "";
  const crewTitle = a.rest ? "Na pausa agora" : a.about ? "No QG agora" : "Robôs desta área";

    <div class="p-hero">${tags}<span class="tag place">${esc(a.place)}</span></div>
    <h2 id="p-title"><i></i>${esc(a.title)}</h2>
    <p class="lede">${a.lede}</p>

    ${tl}${stack}${links}
    <div class="crew"><h3>${crewTitle}</h3><ul id="crew"></ul><ul class="log" id="plog"></ul></div>`;
  pScroll.scrollTop = 0;
  current = a;
  renderCrew(); renderLog();
}
function renderLog() { const el = $("#plog"); if (el && current) el.innerHTML = current.feed.map((t) => `<li>› ${esc(t)}</li>`).join(""); }
function renderCrew() {
  const el = $("#crew"); if (!el || !current) return;
  const list = current.rest
    ? allRobots.filter((r) => r.state === "rest" || (r.state === "walk" && r.dest === "rest"))
    : allRobots.filter((r) => r.area === current);
  const rows = list.map((r) => `<li><b style="color:${r.color}">${r.name}</b><span>${esc(r.status())}</span></li>`);
  if (current.about) rows.push(`<li><b>LUCAS</b><span>revisando o trabalho dos robôs</span></li>`);
  el.innerHTML = rows.join("") || `<li><span>ninguém na pausa: todo mundo trabalhando</span></li>`;
}

/* =========================================================================
   Mundo 3D
   ========================================================================= */
let world = null;
try { if (window.THREE) world = buildWorld(); } catch (e) { console.error(e); world = null; }
if (!world) {
  $("#loading").classList.add("done");
  const n = document.createElement("div"); n.className = "nogl";
  n.textContent = "Seu navegador não conseguiu desenhar o planeta em 3D. Use os botões abaixo para abrir os projetos.";
  document.body.appendChild(n);
  $("#hint").style.display = "none";
  let last = performance.now();
  (function loop(now) { tickLogs(Math.min(0.1, (now - last) / 1000)); last = now; requestAnimationFrame(loop); })(last);
}

function buildWorld() {
  const T = THREE;
  const canvas = $("#world");
  const renderer = new T.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  const scene = new T.Scene();
  const camera = new T.PerspectiveCamera(36, 1, 0.1, 500);
  const R = 10, WATER = -0.12, PLAZA = 0.24;

  /* lights */
  scene.add(new T.HemisphereLight(0xfff0dc, 0x4a4a8a, 0.85));
  const sun = new T.DirectionalLight(0xffe2bf, 0.95); sun.position.set(-14, 16, 18); scene.add(sun);
  const rim = new T.DirectionalLight(0xff9db5, 0.45); rim.position.set(18, -6, -10); scene.add(rim);

  /* stars */
  {
    const g = new T.BufferGeometry(), n = 700, p = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) {
      const u = rand() * 2 - 1, th = rand() * Math.PI * 2, s = Math.sqrt(1 - u * u), r = 160 + rand() * 60;
      p.set([s * Math.cos(th) * r, u * r, s * Math.sin(th) * r - 40], i * 3);
    }
    g.setAttribute("position", new T.BufferAttribute(p, 3));
    scene.add(new T.Points(g, new T.PointsMaterial({ color: 0xfff6e0, size: 1.6, sizeAttenuation: false, transparent: true, opacity: .8 })));
  }

  /* stage → globe (rotates) */
  const stage = new T.Group(); scene.add(stage);
  const globe = new T.Group(); stage.add(globe);

  /* atmosphere */
  stage.add(new T.Mesh(new T.SphereGeometry(R * 1.13, 64, 48), new T.ShaderMaterial({
    uniforms: { c: { value: new T.Color("#ffc6a8") } },
    vertexShader: "varying vec3 vN; varying vec3 vV; void main(){ vec4 mv = modelViewMatrix*vec4(position,1.0); vN = normalize(normalMatrix*normal); vV = normalize(-mv.xyz); gl_Position = projectionMatrix*mv; }",
    fragmentShader: "uniform vec3 c; varying vec3 vN; varying vec3 vV; void main(){ float f = 1.0-abs(dot(vN,vV)); f = pow(f,2.2); gl_FragColor = vec4(c, f*0.7); }",
    side: T.BackSide, transparent: true, blending: T.AdditiveBlending, depthWrite: false,
  })));

  /* ---- terrain ---- */
  function hash3(x, y, z) { let h = Math.imul(x, 374761393) ^ Math.imul(y, 668265263) ^ Math.imul(z, 1274126177); h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967295; }
  function vnoise(x, y, z) {
    const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
    const xf = x - xi, yf = y - yi, zf = z - zi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf);
    const L = (a, b, t) => a + (b - a) * t;
    const c = (i, j, k) => hash3(xi + i, yi + j, zi + k);
    return L(L(L(c(0, 0, 0), c(1, 0, 0), u), L(c(0, 1, 0), c(1, 1, 0), u), v), L(L(c(0, 0, 1), c(1, 0, 1), u), L(c(0, 1, 1), c(1, 1, 1), u), v), w);
  }
  const fbm = (x, y, z) => vnoise(x, y, z) * .6 + vnoise(x * 2.1, y * 2.1, z * 2.1) * .28 + vnoise(x * 4.3, y * 4.3, z * 4.3) * .12;

  const toDir = (lat, lon) => { const la = lat * Math.PI / 180, lo = lon * Math.PI / 180; return new T.Vector3(Math.cos(la) * Math.sin(lo), Math.sin(la), Math.cos(la) * Math.cos(lo)); };
  AREAS.forEach((a) => { a.dir = toDir(a.lat, a.lon); a.plaza = a.rest ? 0.34 : 0.27; });

  function terrain(d) {
    let boost = 0, flat = 0, near = 0;
    for (const a of AREAS) {
      const ang = Math.acos(clamp(d.dot(a.dir), -1, 1));
      boost += 1.4 * Math.exp(-(ang * ang) / 0.075);
      flat = Math.max(flat, 1 - smooth(a.plaza, a.plaza + 0.1, ang));
      near = Math.max(near, 1 - smooth(a.plaza, a.plaza + 0.4, ang));
    }
    const n = fbm(d.x * 1.8 + 7, d.y * 1.8 + 3, d.z * 1.8 + 11);
    const land = (n - 0.5) * 3.2 + boost - 0.12;
    let h;
    if (land < 0) h = WATER;
    else h = 0.04 + (Math.min(land, 1.3) * 0.34 + (fbm(d.x * 7, d.y * 7, d.z * 7) - 0.5) * 0.3 * Math.min(1, land * 2)) * (1 - near * 0.85);
    h = h * (1 - flat) + PLAZA * flat;
    return { h, land, flat };
  }
  const surfH = (d) => Math.max(terrain(d).h, WATER);

  {
    const geo = new T.IcosahedronGeometry(R, 34);
    const pos = geo.attributes.position, n = pos.count;
    const col = new Float32Array(n * 3);
    const v = new T.Vector3(), info = new Array(n);
    for (let i = 0; i < n; i++) {
      v.fromBufferAttribute(pos, i).normalize();
      const t = terrain(v); info[i] = t;
      v.multiplyScalar(R + t.h);
      pos.setXYZ(i, v.x, v.y, v.z);
    }
    const C = (h) => new T.Color(h);
    const pal = {
      deep: C("#3f86c9"), shallow: C("#5fbfe0"), sand: C("#efd9a2"),
      g1: C("#8fd06a"), g2: C("#7cc35e"), g3: C("#a2d978"), hill: C("#69ab55"), rock: C("#b9b39f"), plaza: C("#9fd47c"),
    };
    const fr = rng(7);
    for (let f = 0; f < n; f += 3) {
      const a = info[f], b = info[f + 1], c = info[f + 2];
      const land = (a.land + b.land + c.land) / 3, h = (a.h + b.h + c.h) / 3, flat = Math.max(a.flat, b.flat, c.flat);
      let k;
      if (a.h <= WATER && b.h <= WATER && c.h <= WATER) k = land < -0.45 ? pal.deep : pal.shallow;
      else if (flat > 0.5) k = pal.plaza;
      else if (land < 0.1) k = pal.sand;
      else if (h > 0.5) k = fr() < .5 ? pal.rock : pal.hill;
      else { const r = fr(); k = r < .4 ? pal.g1 : r < .75 ? pal.g2 : pal.g3; }
      for (let j = 0; j < 3; j++) col.set([k.r, k.g, k.b], (f + j) * 3);
    }
    geo.setAttribute("color", new T.BufferAttribute(col, 3));
    geo.computeVertexNormals();
    globe.add(new T.Mesh(geo, new T.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: .95 })));
    globe.add(new T.Mesh(new T.SphereGeometry(R + WATER + 0.02, 96, 64), new T.MeshStandardMaterial({ color: 0x6fd0f0, transparent: true, opacity: .28, roughness: .2, metalness: .1 })));
  }

  /* ---- helpers ---- */
  const mats = {};
  const mat = (c, o = {}) => { const k = c + JSON.stringify(o); return mats[k] || (mats[k] = new T.MeshStandardMaterial({ color: c, flatShading: true, roughness: .85, ...o })); };
  const glow = (c) => mats["g" + c] || (mats["g" + c] = new T.MeshBasicMaterial({ color: c }));
  const UP = new T.Vector3(0, 1, 0);
  function add(parent, geo, material, x = 0, y = 0, z = 0) { const m = new T.Mesh(geo, material); m.position.set(x, y, z); parent.add(m); return m; }
  const Box = (w, h, d) => new T.BoxGeometry(w, h, d);
  const Cyl = (rt, rb, h, s = 8) => new T.CylinderGeometry(rt, rb, h, s);
  const Ball = (r, d = 1) => new T.IcosahedronGeometry(r, d);
  const m4 = new T.Matrix4();
  function orient(obj, dir, fwd, lift = 0) {
    obj.position.copy(dir).multiplyScalar(R + surfH(dir) + lift);
    const f = fwd.clone().sub(dir.clone().multiplyScalar(fwd.dot(dir)));
    if (f.lengthSq() < 1e-8) f.set(1, 0, 0).sub(dir.clone().multiplyScalar(dir.x));
    f.normalize();
    const r = new T.Vector3().crossVectors(dir, f).normalize();
    m4.makeBasis(r, dir, f); obj.quaternion.setFromRotationMatrix(m4);
  }
  function slerpDir(a, b, t, out) {
    const ang = Math.acos(clamp(a.dot(b), -1, 1));
    if (ang < 1e-4) return out.copy(b);
    const s = Math.sin(ang);
    return out.copy(a).multiplyScalar(Math.sin((1 - t) * ang) / s).add(b.clone().multiplyScalar(Math.sin(t * ang) / s)).normalize();
  }
  const pickables = [];
  function tagPick(obj, area, robot) { obj.traverse((o) => { o.userData.area = area; if (robot) o.userData.robot = robot; }); pickables.push(obj); }

  /* ---- trees, clouds, satellite ---- */
  {
    const tr = rng(99), dirs = [];
    for (let i = 0; i < 1200 && dirs.length < 140; i++) {
      const u = tr() * 2 - 1, th = tr() * Math.PI * 2, s = Math.sqrt(1 - u * u);
      const d = new T.Vector3(s * Math.cos(th), u, s * Math.sin(th));
      const t = terrain(d);
      if (t.land < 0.18 || t.flat > 0.01) continue;
      if (AREAS.some((a) => d.angleTo(a.dir) < a.plaza + 0.1)) continue;
      dirs.push(d);
    }
    const trunk = new T.InstancedMesh(Cyl(0.06, 0.09, 0.4, 5), mat(0x8a5a3c), dirs.length);
    const crown = new T.InstancedMesh(new T.ConeGeometry(0.34, 0.8, 6), mat(0xffffff), dirs.length);
    const crown2 = new T.InstancedMesh(Ball(0.36, 0), mat(0xffffff), dirs.length);
    const greens = ["#4f9a4a", "#5fae54", "#3e8a48", "#77b85a"].map((c) => new T.Color(c));
    const blossom = ["#ff9fb8", "#ffc16b"].map((c) => new T.Color(c));
    const o = new T.Object3D(); let k1 = 0, k2 = 0;
    dirs.forEach((d, i) => {
      const s = 0.55 + tr() * 0.5;
      o.position.copy(d).multiplyScalar(R + surfH(d) - 0.03);
      o.quaternion.setFromUnitVectors(UP, d); o.rotateY(tr() * 6); o.scale.setScalar(s);
      o.translateY(0.2 * s); o.updateMatrix();
      trunk.setMatrixAt(i, o.matrix);
      o.translateY(0.5 * s); o.updateMatrix();
      if (tr() < 0.72) { crown.setMatrixAt(k1, o.matrix); crown.setColorAt(k1++, greens[i % 4]); }
      else { o.translateY(-0.12 * s); o.updateMatrix(); crown2.setMatrixAt(k2, o.matrix); crown2.setColorAt(k2++, tr() < .5 ? blossom[i % 2] : greens[(i + 1) % 4]); }
    });
    crown.count = k1; crown2.count = k2;
    globe.add(trunk, crown, crown2);
  }
  const clouds = new T.Group(); stage.add(clouds);
  {
    const cr = rng(5), cm = mat(0xffffff, { roughness: 1, transparent: true, opacity: .92 });
    for (let i = 0; i < 9; i++) {
      const g = new T.Group();
      const u = cr() * 1.6 - 0.8, th = cr() * Math.PI * 2, s = Math.sqrt(1 - u * u);
      const d = new T.Vector3(s * Math.cos(th), u, s * Math.sin(th));
      for (let k = 0; k < 4; k++) add(g, Ball(0.45 + cr() * 0.35, 1), cm, (k - 1.5) * 0.55, cr() * 0.2, (cr() - .5) * 0.5);
      g.position.copy(d).multiplyScalar(R + 2.6 + cr() * 0.8);
      g.quaternion.setFromUnitVectors(UP, d); g.scale.setScalar(0.45 + cr() * .3);
      clouds.add(g);
    }
  }
  const sat = new T.Group(); stage.add(sat);
  const satBody = new T.Group(); satBody.position.set(R + 7, 0, 0); sat.add(satBody);
  add(satBody, Box(0.6, 0.6, 0.9), mat(0xeae4d6));
  add(satBody, Box(1.6, 0.04, 0.6), mat(0x3e64b8, { metalness: .4, roughness: .4 }), 1.15, 0, 0);
  add(satBody, Box(1.6, 0.04, 0.6), mat(0x3e64b8, { metalness: .4, roughness: .4 }), -1.15, 0, 0);
  add(satBody, new T.ConeGeometry(0.25, 0.3, 10, 1, true), mat(0xffffff, { side: T.DoubleSide }), 0, 0.42, 0);
  const satBlink = add(satBody, Ball(0.07), glow(0xff5a5a), 0, 0.36, 0.5);
  sat.rotation.set(0.35, 0, 0.5);

  /* ---- buildings ---- */
  const anim = [];
  const B = {
    library(g, c) {
      add(g, Box(2.2, 1.1, 1.5), mat(0xf6ecd9), 0, 0.55, -0.3);
      const prism = new T.CylinderGeometry(0.9, 0.9, 2.4, 3); prism.rotateX(-Math.PI / 2); prism.rotateY(Math.PI / 2); prism.scale(1, 0.6, 1);
      add(g, prism, mat(c), 0, 1.37, -0.3);
      for (let i = 0; i < 4; i++) add(g, Cyl(0.08, 0.08, 1, 8), mat(0xffffff), -0.75 + i * 0.5, 0.5, 0.55);
      add(g, Box(2.4, 0.12, 0.6), mat(0xe2d5bb), 0, 0.06, 0.6);
      add(g, Box(0.45, 0.7, 0.05), mat(0x5a3b2a), 0, 0.35, 0.46);
      const book = new T.Group(); book.position.set(0, 2.55, -0.3); g.add(book);
      add(book, Box(0.7, 0.9, 0.16), mat(c)); add(book, Box(0.62, 0.84, 0.14), mat(0xfffaf0), 0.06, 0, 0);
      add(book, Box(0.06, 0.92, 0.18), mat(0x1f6f68), -0.34, 0, 0);
      anim.push((t) => { book.rotation.y = t * 0.8; book.position.y = 2.55 + Math.sin(t * 1.6) * 0.12; });
      for (let i = 0; i < 3; i++) add(g, Box(0.35, 0.12, 0.25), mat([0xe36a5c, 0x2ec4b6, 0xf2b84b][i]), 1.45, 0.06 + i * 0.12, 0.6 - i * 0.02);
    },
    archive(g, c) {
      for (let i = 0; i < 3; i++) {
        add(g, Box(1.2, 0.72, 1), mat(i % 2 ? 0xdfe8f6 : 0xc7d6ef), 0, 0.36 + i * 0.74, -0.2);
        for (let j = 0; j < 2; j++) add(g, Box(0.9, 0.06, 0.03), mat(c), 0, 0.2 + i * 0.74 + j * 0.3, 0.31);
      }

    const bulb = add(head, Ball(0.06, 1), new T.MeshBasicMaterial({ color: c }), 0, 0.4, 0);
    const prop = add(body, Box(0.26, 0.16, 0.14), mat(0xfffaf0), 0, 0.5, 0.34); prop.visible = false;
    const zz = new T.Sprite(new T.SpriteMaterial({ map: zzTex, transparent: true, depthWrite: false })); zz.scale.set(0.8, 0.4, 1); zz.position.set(0.35, 1.6, 0); zz.visible = false; root.add(zz);
    root.scale.setScalar(0.8);
    return { root, body, legs, arms, head, eyes, bulb, prop, zz };
  }

  AREAS.forEach((a) => a.robots.forEach(([name, job, col], k) => {
    const color = col || a.color;
    const parts = makeRobot(color, a.helmet);
    globe.add(parts.root);
    const r = {
      name, job, color, area: a, parts, slot: a.workSlots[k], seed: Math.random() * 10,
      style: workAnims[(k + a.robots.length) % workAnims.length],
      state: "work", timer: 8 + Math.random() * 30 + (k === 0 ? 12 : 0), dir: null, from: null, to: null, prog: 0, dest: "work", restSlot: null,
      status() {
        if (this.state === "work") return `trabalhando · ${this.job}`;
        if (this.state === "rest") return this.restSlot && this.restSlot.pad ? "recarregando a bateria" : "descansando no banco";
        return this.dest === "rest" ? "indo para a pausa" : `voltando para ${this.area.short || this.area.title}`;
      },
    };
    r.dir = toGlobeDir(a, r.slot.local);
    tagPick(parts.root, a, r);
    allRobots.push(r);
  }));
  // two robots start the day already on break
  [allRobots[1], allRobots[7]].forEach((r, i) => { r.restSlot = rest.slots[4 + i]; r.state = "rest"; r.timer = 4 + i * 5; r.dir = toGlobeDir(rest, r.restSlot.local); });

  function freeRestSlot() {
    const used = new Set(allRobots.map((r) => r.restSlot).filter(Boolean));
    const free = rest.slots.filter((s) => !used.has(s));
    return free.length ? free[Math.floor(Math.random() * free.length)] : null;
  }
  function updateRobot(r, dt, t) {
    const P = r.parts;
    r.timer -= dt;
    if (r.state === "work" && r.timer <= 0) {
      const slot = freeRestSlot();
      const others = allRobots.filter((o) => o.area === r.area && o !== r && o.state === "work").length;
      if (slot && (others > 0 || r.area.robots.length === 1)) {
        r.restSlot = slot; r.state = "walk"; r.dest = "rest";
        r.from = r.dir.clone(); r.to = toGlobeDir(rest, slot.local); r.prog = 0; r.len = Math.max(0.05, r.from.angleTo(r.to));
      } else r.timer = 6 + Math.random() * 8;
    } else if (r.state === "rest" && r.timer <= 0) {
      r.state = "walk"; r.dest = "work"; r.from = r.dir.clone(); r.to = toGlobeDir(r.area, r.slot.local); r.prog = 0; r.len = Math.max(0.05, r.from.angleTo(r.to));
    }
    let face, lift = 0;
    if (r.state === "walk") {
      r.prog += (dt * 0.22) / r.len;
      const prev = r.dir.clone();
      slerpDir(r.from, r.to, Math.min(1, r.prog), r.dir);
      face = r.dir.clone().sub(prev);
      if (face.lengthSq() < 1e-10) face = r.to.clone().sub(r.from);
      const over = terrain(r.dir).h <= WATER;
      lift = over ? 0.14 + Math.sin(t * 4) * 0.04 : Math.abs(Math.sin(t * 9 + r.seed)) * 0.05;
      const sw = Math.sin(t * 9 + r.seed) * 0.7;
      P.legs[0].rotation.x = sw; P.legs[1].rotation.x = -sw;
      P.arms[0].rotation.x = -sw * 0.8; P.arms[1].rotation.x = sw * 0.8; P.arms[1].rotation.z = 0;
      P.body.position.y = 0; P.zz.visible = false; P.prop.visible = false; P.head.rotation.set(0, 0, 0);
      if (r.prog >= 1) {
        if (r.dest === "rest") { r.state = "rest"; r.timer = 9 + Math.random() * 10; }
        else { r.state = "work"; r.timer = 18 + Math.random() * 30; r.restSlot = null; }
      }
    }
    if (r.state === "work") {
      face = toGlobeVec(r.area, r.slot.face);
      const s = r.seed;
      P.legs.forEach((l) => (l.rotation.x = 0)); P.zz.visible = false;
      P.body.position.y = Math.abs(Math.sin(t * 3 + s)) * 0.04;
      P.head.rotation.set(0, Math.sin(t * 0.7 + s) * 0.35, 0);
      P.arms[1].rotation.z = 0;
      if (r.style === "type") { P.arms[0].rotation.x = -1.2 + Math.sin(t * 14 + s) * 0.2; P.arms[1].rotation.x = -1.2 + Math.cos(t * 14 + s) * 0.2; P.prop.visible = false; }
      else if (r.style === "hammer") { P.arms[1].rotation.x = -1.5 + Math.abs(Math.sin(t * 6 + s)) * 1.2; P.arms[0].rotation.x = -0.2; P.prop.visible = false; }
      else if (r.style === "carry") { P.arms[0].rotation.x = P.arms[1].rotation.x = -1.3; P.prop.visible = true; P.body.position.y = Math.abs(Math.sin(t * 2 + s)) * 0.1; }
      else { P.arms[1].rotation.x = -1.6; P.arms[1].rotation.z = Math.sin(t * 2 + s) * 0.5; P.arms[0].rotation.x = 0; P.prop.visible = false; }
    }
    if (r.state === "rest") {
      face = toGlobeVec(rest, r.restSlot.face);
      P.prop.visible = false;
      P.arms.forEach((a) => { a.rotation.x = -0.2; a.rotation.z = 0; });
      if (r.restSlot.sit) { P.legs.forEach((l) => (l.rotation.x = -1.5)); P.body.position.y = 0.22; }
      else { P.legs.forEach((l) => (l.rotation.x = 0)); P.body.position.y = Math.sin(t * 1.5 + r.seed) * 0.03; lift = 0.08; }
      const k = (t * 0.4 + r.seed) % 1;
      P.zz.visible = true; P.zz.position.y = 1.6 + k * 0.4; P.zz.material.opacity = 1 - k;
      P.head.rotation.set(0.25, 0, 0);
    }
    const blink = Math.sin(t * 1.3 + r.seed * 3) > 0.985;
    P.eyes.forEach((e) => (e.scale.y = blink ? 0.1 : r.state === "rest" ? 0.25 : 1));
    const charge = r.state === "rest" && r.restSlot.pad;
    P.bulb.material.color.set(charge ? (Math.sin(t * 5) > 0 ? 0x7dff9c : 0x2e8a4a) : r.color);
    orient(P.root, r.dir, face, lift);
  }

  /* ---- labels ---- */
  const labels = $("#labels");
  AREAS.forEach((a) => {
    const el = document.createElement("div");
    el.className = "lbl"; el.style.setProperty("--c", a.color);
    el.innerHTML = `<div class="t"><i></i>${esc(a.place)}</div><div class="s"></div>`;
    el.addEventListener("click", () => open(a.id));
    el.addEventListener("pointerenter", () => setHover(a, null));
    el.addEventListener("pointerleave", () => setHover(null, null));
    labels.appendChild(el);
    a.lbl = el; a.lblS = el.querySelector(".s"); a.lblS.textContent = "› " + a.feed[a.feed.length - 1];
  });

  /* ---- camera & interaction ---- */
  const view = { dist: 50, offX: 0, offY: 0 };
  let baseDist = 50;
  function resize() {
    const w = innerWidth, h = innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h; camera.updateProjectionMatrix();
    const half = Math.tan((camera.fov / 2) * Math.PI / 180);
    baseDist = Math.max(R / 0.56, R / (0.8 * camera.aspect)) / half + 2;
    if (!current && !tween) view.dist = baseDist;
  }
  let tween = null, lastInteract = 0;
  addEventListener("resize", resize); resize();

  globe.quaternion.setFromEuler(new T.Euler(0.42, -0.25, 0));
  const ptr = { down: false, moved: 0, x: 0, y: 0, vx: 0, vy: 0, pts: new Map(), pinch: 0 };
  const qx = new T.Quaternion(), qy = new T.Quaternion(), AX = new T.Vector3(1, 0, 0), AY = new T.Vector3(0, 1, 0);
  function spin(dx, dy) {
    const k = 0.0045 * (view.dist / 50);
    qx.setFromAxisAngle(AY, dx * k); qy.setFromAxisAngle(AX, dy * k);
    globe.quaternion.premultiply(qx).premultiply(qy);
  }
  canvas.addEventListener("pointerdown", (e) => {
    canvas.setPointerCapture(e.pointerId);
    ptr.pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (ptr.pts.size === 2) { const [p1, p2] = [...ptr.pts.values()]; ptr.pinch = Math.hypot(p1.x - p2.x, p1.y - p2.y); }
    ptr.down = true; ptr.moved = 0; ptr.x = e.clientX; ptr.y = e.clientY; ptr.vx = ptr.vy = 0; tween = null; lastInteract = performance.now();
    $("#hint").style.opacity = 0;
  });
  canvas.addEventListener("pointermove", (e) => {
    if (ptr.pts.has(e.pointerId)) ptr.pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (ptr.pts.size === 2) {
      const [p1, p2] = [...ptr.pts.values()]; const d = Math.hypot(p1.x - p2.x, p1.y - p2.y);
      if (ptr.pinch) view.dist = clamp(view.dist * (ptr.pinch / d), 20, baseDist * 1.3);
      ptr.pinch = d; ptr.moved = 99; return;
    }
    if (ptr.down) {
      const dx = e.clientX - ptr.x, dy = e.clientY - ptr.y;
      ptr.moved += Math.abs(dx) + Math.abs(dy); ptr.x = e.clientX; ptr.y = e.clientY;
      if (ptr.moved > 5) { canvas.classList.add("dragging"); spin(dx, dy); ptr.vx = dx; ptr.vy = dy; lastInteract = performance.now(); setHover(null, null); }
    } else hoverAt(e.clientX, e.clientY);
  });
  const endPtr = (e) => {
    ptr.pts.delete(e.pointerId);
    if (ptr.pts.size) return;
    canvas.classList.remove("dragging");
    if (ptr.down && ptr.moved <= 5) {
      const hit = pick(e.clientX, e.clientY);
      if (hit) open(hit.area.id); else if (current) close();
    }
    ptr.down = false; ptr.pinch = 0;
  };
  canvas.addEventListener("pointerup", endPtr);
  canvas.addEventListener("pointercancel", endPtr);
  canvas.addEventListener("pointerleave", () => { if (!ptr.down) setHover(null, null); });
  canvas.addEventListener("wheel", (e) => { e.preventDefault(); view.dist = clamp(view.dist * (1 + e.deltaY * 0.0012), 20, baseDist * 1.3); lastInteract = performance.now(); }, { passive: false });

  const ray = new T.Raycaster(), mouse = new T.Vector2();
  function pick(x, y) {
    mouse.set((x / innerWidth) * 2 - 1, -(y / innerHeight) * 2 + 1);
    ray.setFromCamera(mouse, camera);
    const h = ray.intersectObjects(pickables, true)[0];
    return h && h.object.userData.area ? { area: h.object.userData.area, robot: h.object.userData.robot } : null;
  }
  let hoverArea = null, hoverRobot = null, hoverPos = { x: 0, y: 0 };
  const tip = $("#tip");
  function hoverAt(x, y) { hoverPos = { x, y }; const h = pick(x, y); setHover(h && h.area, h && h.robot); }
  function setHover(area, robot) {
    if (hoverArea && hoverArea !== area) hoverArea.lbl.classList.remove("hot");
    hoverArea = area; hoverRobot = robot;
    if (area) area.lbl.classList.add("hot");
    canvas.classList.toggle("hovering", !!area);
    if (robot) {
      tip.style.setProperty("--c", robot.color);
      tip.innerHTML = `<b>${robot.name}</b><br>${esc(robot.status())}<br><span style="opacity:.7">clique para abrir ${esc(robot.area.short || robot.area.title)}</span>`;
      tip.classList.add("on");
    } else tip.classList.remove("on");
  }

  function focusArea(a) {
    const n = a.dir.clone().applyQuaternion(globe.quaternion).normalize();
    const want = new T.Vector3(0, 0.12, 1).normalize();
    const q1 = new T.Quaternion().setFromUnitVectors(n, want).multiply(globe.quaternion);
    const wide = innerWidth > 760;
    tween = { q0: globe.quaternion.clone(), q1, d0: view.dist, d1: wide ? 31 : 40, x0: view.offX, x1: wide ? -5.8 : 0, y0: view.offY, y1: wide ? -0.6 : 4.8, t: 0, dur: reduce ? 0.01 : 1.3 };
  }
  function unfocus() { tween = { q0: globe.quaternion.clone(), q1: globe.quaternion.clone(), d0: view.dist, d1: baseDist, x0: view.offX, x1: 0, y0: view.offY, y1: 0, t: 0, dur: reduce ? 0.01 : 1.0 }; }

  /* ---- loop ---- */
  const wp = new T.Vector3(), nrm = new T.Vector3(), toCam = new T.Vector3();
  let last = performance.now(), time = 0, crewT = 0;
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    time += reduce ? dt * 0.4 : dt;
    if (tween) {
      tween.t += dt / tween.dur;
      const e = tween.t >= 1 ? 1 : 1 - Math.pow(1 - tween.t, 3);
      globe.quaternion.slerpQuaternions(tween.q0, tween.q1, e);
      view.dist = tween.d0 + (tween.d1 - tween.d0) * e;
      view.offX = tween.x0 + (tween.x1 - tween.x0) * e;
      view.offY = tween.y0 + (tween.y1 - tween.y0) * e;
      if (tween.t >= 1) tween = null;
    } else if (!ptr.down) {
      if (Math.abs(ptr.vx) + Math.abs(ptr.vy) > 0.05) { spin(ptr.vx, ptr.vy); const f = Math.pow(0.9, dt * 60); ptr.vx *= f; ptr.vy *= f; }
      else if (!current && !reduce && now - lastInteract > 2500) { qx.setFromAxisAngle(AY, dt * 0.06); globe.quaternion.premultiply(qx); }
    }
    camera.position.set(-view.offX, -view.offY, view.dist); camera.lookAt(-view.offX, -view.offY, 0);
    clouds.rotation.y += dt * 0.025; clouds.rotation.x = 0.2;
    sat.rotation.y += dt * 0.18; satBody.rotation.x += dt * 0.3; satBlink.visible = Math.sin(time * 6) > 0;
    anim.forEach((f) => f(time));
    packets.forEach((p) => { p.t = (p.t + dt * p.speed) % 1; p.p.position.copy(p.curve.getPoint(p.t)); p.p.rotation.set(time * 2, time * 3, 0); });
    allRobots.forEach((r) => updateRobot(r, dt, time));
    tickLogs(dt);
    globe.updateMatrixWorld();
    AREAS.forEach((a) => {
      a.labelAnchor.getWorldPosition(wp);
      nrm.copy(wp).normalize();
      const facing = nrm.dot(toCam.copy(camera.position).sub(wp).normalize());
      const v = wp.clone().project(camera);
      const x = (v.x * 0.5 + 0.5) * innerWidth, y = (-v.y * 0.5 + 0.5) * innerHeight;
      a.lbl.classList.toggle("off", !(facing > 0.2 && v.z < 1));
      const s = clamp(1.3 - view.dist / 90, 0.72, 1.08);
      a.lbl.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) translate(-50%, -100%) scale(${s.toFixed(3)})`;
      a.lbl.style.zIndex = Math.round(facing * 100);
    });
    if (hoverRobot) tip.style.transform = `translate(${hoverPos.x + 16}px, ${hoverPos.y + 14}px)`;
    crewT -= dt;
    if (crewT < 0) { crewT = 0.5; if (current) renderCrew(); $("#s-rest").textContent = allRobots.filter((r) => r.state === "rest").length; }
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame((t) => { last = t; frame(t); $("#loading").classList.add("done"); });

  return { focusArea, unfocus };
}

/* =========================================================================
   Abrir / fechar área (com histórico do navegador)
   ========================================================================= */
function open(id, push = true) {
  const a = byId[id]; if (!a) return;
  fillPanel(a);
  panel.classList.add("open");
  document.body.classList.add("focused");
  AREAS.forEach((x) => x.dockBtn.setAttribute("aria-current", x === a ? "true" : "false"));
  if (world) world.focusArea(a);
  if (push && location.hash !== "#/" + id) history.pushState({ id }, "", "#/" + id);
  $("#hint").style.opacity = 0;
}
function close(push = true) {
  if (!current) return;
  const a = current;
  current = null;
  panel.classList.remove("open");
  document.body.classList.remove("focused");
  AREAS.forEach((x) => x.dockBtn.setAttribute("aria-current", "false"));
  if (world) world.unfocus();
  if (push) history.pushState({}, "", location.pathname + location.search);
  a.dockBtn.focus({ preventScroll: true });
}
function step(dir) {
  const i = AREAS.indexOf(current);
  const a = AREAS[(i + dir + AREAS.length) % AREAS.length];
  history.replaceState({ id: a.id }, "", "#/" + a.id);
  open(a.id, false);
}
$("#back").addEventListener("click", () => close());
$("#prev").addEventListener("click", () => step(-1));
$("#next").addEventListener("click", () => step(1));
addEventListener("keydown", (e) => {
  if (!current) return;
  if (e.key === "Escape") close();
  else if (e.key === "ArrowRight") step(1);
  else if (e.key === "ArrowLeft") step(-1);
});
addEventListener("popstate", () => {
  const id = (location.hash.match(/^#\/(.+)$/) || [])[1];
  if (id && byId[id]) open(id, false); else close(false);
});
const startId = (location.hash.match(/^#\/(.+)$/) || [])[1];
if (startId && byId[startId]) setTimeout(() => open(startId, false), 300);

function tick() { $("#clock").textContent = new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }); }
tick(); setInterval(tick, 10000);
</script>
</body>
